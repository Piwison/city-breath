[project]
name = "city-breath-pipeline"
version = "0.1.0"
description = "城市呼吸：北捷 OD 月檔本機彙總流程"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=2.0,<3",
  "numpy>=2",
  "pyproj>=3.7",
  "pyshp>=2.3",
  "rasterio>=1.4",
  "scikit-learn>=1.9",
  "scipy>=1.14",
  "shapely>=2.1",
]

[project.scripts]
city-breath = "city_breath_pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/city_breath_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
