# 城市呼吸 initiative 的 epics，依建置順序。由 v6 epics.md 遷移（2026-10-29），2026-11-03 replan，2026-11-10 replan（天光定案），2026-11-11 replan（第一次使用者走查）；2026-11-11 Piwi 決定（3.20 區總量、6.2 預覽部署提前、6.3 正式上線）。
# 2026-11-14 replan（產品計畫 v2）：票依階段排。階段 0：3.12、3.14 → 階段 1：3.21、3.22、3.15、6.2、6.4（關卡 1）→ 階段 2：4.1、4.2、4.4、3.16、3.17、3.11、6.5、6.6（關卡 2）、6.3 → 階段 3：3.23、1.14、1.15、3.18、7.6、7.4、7.7 → 階段 4：探索捷徑（8.x）、車站個性（5.x）。
# 階段跨 epic，epic 的順序只能排到「誰等誰」；關卡用各階段第一張票的 unknown 擋住，見 initiative Notes 2026-11-14。

[[epic]]
id = 1
slug = "epic-data-pipeline"
title = "每月 OD 原始檔變成網站讀得動的小檔"
description = "一個指令就能把該月 OD 檔彙總成靜態 JSON（契約 v4：行政區對照、行政區起訖與區總量、逐日每站每小時、每站來源），底圖圖層也由管線輸出，車站類型由人定名。2026-11-14 重開，加上線後第一次月更要用的兩張：停班停課日從平均排除（1.14）、每月更新一個指令並可重現（1.15）。"
covers = ["R10", "R18", "R20", "R26"]
# v6: Epic 0

[[epic]]
id = 2
slug = "epic-visual-system"
title = "城市呼吸有一套微縮城市視覺系統"
description = "微縮城市方向定案為天光（DESIGN.md），tokens 與 base 用 impeccable 整理，台北盆地的場景基底（地形、河川、綠地、路線、天光）在建置版可用。"
covers = ["R12", "R20"]
after = [{ epic = 1, needs = "底圖圖層輸出（1.12）" }]
# v6: Epic 1

[[epic]]
id = 3
slug = "epic-city-breath-home"
title = "城市觀察者看得到一整天各行政區之間的流動"
description = "首頁自動播放行政區流向、可切換平日／假日，鏡頭照地圖習慣操作；點一個行政區看這區的人去哪、誰來這裡並展開該區的站，點站開車站卡（含整年最常見的類型與一句話）。產品計畫 v2：每張卡第一行是一句答案、卡片有兩段高度，每張卡都分享得出去（分享面板、連結預覽圖），有關於與資料來源、一次一條的提示；上線後加我的站（回訪）與假日大家去哪。地標、徽章、最忙站與活圖例移到 epic-explore-shortcuts。"
covers = ["R3", "R4", "R11", "R13", "R17", "R20", "R21", "R22", "R23", "R24", "R25", "R30"]
after = [{ epic = 1, needs = "契約 v2 的行政區對照與行政區起訖彙總" }, { epic = 2, needs = "微縮城市場景基底（2.3）" }]
# v6: Epic 2

[[epic]]
id = 4
slug = "epic-commute-card"
title = "通勤族找到同路人並把通勤卡分享出去"
description = "一鍵下載直式分享卡（已完成，行政區卡與活動卡共用版型）；畫面下方的主按鈕「找你的站」打開可打字、依路線分組的搜尋，選站後輸入迄站與時段看到同路人數、名次與早晚一小時比較；通勤卡套用新卡框與分享面板，通勤與分享的事件在後台量得到。"
covers = ["R1", "R2", "R17", "R21"]
after = [{ epic = 1, needs = "od/{stationId}.json 分片" }, { epic = 2, needs = "分享卡的視覺 token" }, { epic = 3, needs = "車站卡（3.12）、兩段高度的卡框（3.22）、分享面板與網址（3.15）" }]
# v6: Epic 3

[[epic]]
id = 6
slug = "epic-source-and-launch"
title = "網站過了真機與真人兩道關卡後公開上線"
description = "分享入口（3.15）做好後先預覽部署到 Vercel（6.2，含計數骨架與品牌載入畫面），Piwi 用兩支手機實測效能與分享連結（6.4，關卡 1）；階段 2 的票做完後補上線品質（6.5：冒煙測試、獨立審查、錯誤畫面、鍵盤、授權與來源清單）、找 5 位真人測試（6.6，關卡 2），通過後正式上線（6.3）。"
covers = ["R11", "R22", "R27", "R28", "R29"]
after = [{ epic = 3, needs = "6.2 等分享入口與網址（3.15）；6.4 等階段 0、1 的場景與卡片（3.14、3.21、3.22）；6.5 等階段 2 的 3.16、3.17、3.11" }, { epic = 4, needs = "6.5、6.6 等找你的站與通勤卡（4.2）與計數驗證（4.4）" }]
# v6: Epic 5

[[epic]]
id = 7
slug = "epic-event-days"
title = "使用者看得到上個月哪幾天特別不一樣、為什麼"
description = "每月自動列出異常日並對上場館檔期，人工補的活動附來源，對不到的標「原因未查證」；時間軸的「大日子」點進一天看和平常的差異、散場高峰周邊站與人從哪些區來，活動卡可分享。產品計畫 v2：畫面的三張（7.6、7.4、7.7）排在上線後第一次月更（階段 3），套用新卡框與分享面板。"
covers = ["R5", "R17", "R21", "R26"]
after = [{ epic = 1, needs = "逐日每站每小時資料（1.10）；7.6 接在停班停課日（1.14）之後改 events.json" }, { epic = 3, needs = "行政區流向地圖、兩段高度的卡框（3.22）、分享面板與網址（3.15）" }, { epic = 4, needs = "分享卡版型（4.3）" }]
