# 城市呼吸 initiative 的 epics，依建置順序。由 v6 epics.md 遷移（2026-10-29）。

[[epic]]
id = 1
slug = "epic-data-pipeline"
title = "每月 OD 原始檔變成網站讀得動的小檔"
description = "一個指令就能把該月 OD 檔彙總成契約 v1 的靜態 JSON，車站類型由人定名。"
covers = ["R10"]
# v6: Epic 0

[[epic]]
id = 2
slug = "epic-visual-system"
title = "城市呼吸有一套 hallmark 產出的視覺系統"
description = "hallmark 選定主題並產出 tokens.css／base.css，底圖可用。"
covers = ["R12"]
# v6: Epic 1

[[epic]]
id = 3
slug = "epic-city-breath-home"
title = "城市觀察者看得到一整天的人潮流動"
description = "首頁地圖上站點脹縮、前 200 組弧線、時間軸播放與平日／假日切換，在手機上順暢。"
covers = ["R3"]
after = [{ epic = 1, needs = "契約 v1 的 stations.json 與 flows.json" }]
# v6: Epic 2

[[epic]]
id = 4
slug = "epic-commute-card"
title = "通勤族找到同路人並把通勤卡分享出去"
description = "輸入起訖站與時段看到同路人數與名次，一鍵下載直式分享卡，下載次數可計數。"
covers = ["R1", "R2"]
after = [{ epic = 1, needs = "od/{stationId}.json 分片" }, { epic = 2, needs = "分享卡的視覺 token" }]
# v6: Epic 3

[[epic]]
id = 5
slug = "epic-station-personality"
title = "使用者認識每個站的個性"
description = "點站開啟車站個性卡：類型、一句話、平假日曲線、前 5 目的地與同類型站。"
covers = ["R4"]
after = [{ epic = 1, needs = "人工定名的車站類型" }]
# v6: Epic 4

[[epic]]
id = 6
slug = "epic-source-and-launch"
title = "網站公開上線並交代資料來源"
description = "資料來源頁說清楚出處與限制，網站部署到 Vercel。"
covers = ["R11"]
after = [{ epic = 3, needs = "首頁" }, { epic = 4, needs = "通勤卡" }]
