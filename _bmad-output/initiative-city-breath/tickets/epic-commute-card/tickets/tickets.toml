description = "通勤卡顯示 computeCommute 算出的同路人數、名次與起站前 5 目的地（邏輯與測試已完成），加「早一點、晚一點出門呢？」三格比較前後一小時，點了直接換時段（A3）；少於 10 人只顯示「少於 10 人」；卡內用 3.6 的時間列。產品計畫 v2：套用 3.22 的新卡框（兩段高度；第一行是一句答案，例如「平日 8 點，約 N 人和你一樣從頂溪到台北車站」，少於 10 人時寫「少於 10 人」、不寫數字）與 3.15 的分享面板：卡片預覽、「存成圖片」（4.3 的版型）與「複製連結」（網址加通勤的起站、迄站、時段，AD-16 只由 state/url.ts 讀寫）（走查 2026-11-11 B1）。看到結果送 `commute_result_shown`，存圖送 `share_card_downloaded`（kind 為 commute），複製連結送 `share_link_copied`（AD-20，骨架在 6.2）。"
