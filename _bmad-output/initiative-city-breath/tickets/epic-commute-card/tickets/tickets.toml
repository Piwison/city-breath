title = "找車站與起訖站輸入"
description = "上方「找車站／通勤」入口疊在首頁上，播放中也能直接用：可打字搜尋的站選單（站名與別名都找得到），選站後可「只看起站」（鏡頭飛到該站、開 3.12 的車站卡，看這站這一小時去哪幾區），或再選迄站與時段看同路人；接上車站卡的「從這站找通勤」；面板寫明環狀線沒有出站紀錄、不能當迄站（走查 A1、A4、A7）。走查 2026-11-11 F3：清單依路線分組、站序照路線（轉乘站在每條線下都出現），不依行政區分組；最近用過的站列在最上面（這次造訪內，AD-16 不保存選過的站；要跨次保存待 Piwi 決定，見 epic Notes）；起訖預設留空，已選了一站就帶入當起站，不放無關的預設站。出發時段選單列出 2–4 點但標「停止營運」不能選，和時間軸一致（走查小問題）。入口和 3.15、3.17 的按鈕在同一排，接在它們之後做。"
