[[entry]]
id = 1
type = "story"
title = "找你的站：搜尋車站與起訖站輸入"
description = "主要入口改成畫面下方一顆主按鈕「找你的站」（決定 1，體驗原則 1、4），取代左上角的「找你的通勤」；播放中也能直接按。按了打開搜尋：可打字（站名與別名都找得到）、清單依路線分組、站序照路線（轉乘站在每條線下都出現），不依行政區分組（決定 15；走查 2026-11-11 F3）；最近用過的站排最前、跨次造訪記住（Piwi 2026-11-11；AD-22）：最多 5 站、新的在前、重複的移到最前，只存站 ID（AD-2，跨月份通用），不存人數、時段、起訖組合或任何數字；只經 web/src/state/progress.ts 存在 AD-22 的同一個鍵（這張與 3.11 中先做的建立這個模組，後做的加欄位，寫入時保留不認得的欄位），localStorage 不能用時退回記憶體；不進網址、分享卡與 track()；當月 stations.json 沒有的站不列。也可以不搜尋、直接點地圖。選站後鏡頭飛到該站、開 3.12 的車站卡，可再選迄站與時段看同路人（4.2），並接上車站卡的「從這站找通勤」；面板寫明環狀線沒有出站紀錄、不能當迄站（走查 A1、A4、A7）。起訖預設留空，已選了一站就帶入當起站，不放無關的預設站；出發時段選單列出 2–4 點但標「停止營運」不能選，和時間軸一致。打開搜尋送 `commute_input_started`（track.ts 骨架在 6.2，AD-20）。不支援 3D 的裝置的靜態頁用同一個搜尋。關於頁（3.17）若已上線，在「只存在這個瀏覽器」的說明加上最近用過的站；還沒上線就由 3.17 列入。「用過」指在這個搜尋選到的站（只看這站、通勤起站或迄站）。"
verify = "手機上主按鈕在畫面下半部、高 44px 以上，左上角沒有「找你的通勤」；打「忠孝」就列出忠孝復興、忠孝新生、忠孝敦化；清單依路線分組，中山站在淡水信義線與松山新店線下都找得到；選站後開車站卡，3 步內看到同路人；選環狀線站當迄站時看到說明；剛選過的站排在最上面，重新整理後還在，選第 6 站時最舊的那站被擠掉；vitest：progress.ts 存的最近用過的站只有站 ID 字串、最多 5 個，寫入後其他欄位原樣保留，封鎖 localStorage 時仍列出這次選過的站且不報錯，當月沒有的站 ID 被略過；網址與分享卡不含最近用過的站；沒選站時起訖是空的；時段選單的 2–4 點標停止營運；打開搜尋送出 commute_input_started。"
