# 使用者看得到上個月哪幾天特別不一樣、為什麼 的 stories，依建置順序。2026-11-04 refine，2026-11-10 replan（天光定案），2026-11-11 replan（第一次使用者走查）。

[[entry]]
id = 1
type = "story"
title = "異常日與 events.json"
description = "新增 pipeline/anomaly.py：依 AD-14 算全市級與站級異常日（平常＝同月同星期幾、排除當日的中位數），輸出 events.json 的 days 與 anomalies（eventIds 先為空），把契約寫進 docs/data-contract.md，並移除 v1 的 daily.json（AD-4 的假日檢查改讀 events.json）。這是本 epic 的 tracer bullet。"
verify = "2026-09 的 events.json 裡，9/13 小巨蛋站與 9/5 劍潭站出現在站級異常；全市級異常含 9/28 教師節；pytest 與 npm run build 通過。"
covers = ["R1"]
after = ["1.10"]
hitl = false
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "場館檔期自動匯入"
description = "從臺北市資料大平臺抓小巨蛋場地租用、花博公園展館、中山堂演出的當月檔期快照到 data/raw/，對上 venues.csv 的車站，和站級異常日配對後寫進 events.json 的 events 與 eventIds；租用期含進場拆台，用期間內的站級尖峰判定演出日；定下站級異常門檻並寫回 architecture AD-14。"
verify = "2026-09 的 IVE（9/7–13）、漢斯季默（9/20–21）配對到小巨蛋站的異常日，來源標 auto 並附資料集網址。"
covers = ["R1"]
after = [1]
hitl = false
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "人工活動表"
description = "pipeline/config/events.csv（起訖日、場館、名稱、來源網址、verified）由管線合併進 events.json，標 manual；補上 2026-09 已查證的 SEMICON（南港展覽館 9/2–4）與大象來了（劍潭 9/5）；對不到的異常日維持「原因未查證」；把每月補活動的步驟寫進 CLAUDE.md 的每月更新流程。"
verify = "2026-09 的 events.json 有 SEMICON 與大象來了兩筆 manual 事件並配對到異常日；沒有來源網址的列會讓 build 報錯。"
covers = ["R1"]
after = [1]
hitl = true
risk = "low"

[[entry]]
id = 6
type = "story"
title = "活動日的每小時平常與周邊站"
description = "anomaly.py 依 AD-14 的「平常」定義（同月同星期幾、排除當日的中位數），為有活動或站級異常的車站多輸出每小時進站、出站的平常值，並為 venues.csv 的場館站列出 1.5 公里內最近的 5 站（含場館站）與它們的每小時平常，寫進 events.json；契約、docs/data-contract.md、types.ts 同一個 commit（AD-1、AD-14）。活動卡的「對照平常」與「周邊站」只查這張表，前端不自己算平常、不自己找周邊站。"
verify = "2026-09 的 events.json 裡，9/13 小巨蛋站有 24 格進出平常值、5 個周邊站都在 1.5 公里內；pytest 驗證平常值與 anomaly.py 的日總量平常用同一個定義。"
covers = ["R1"]
after = [1, 2, 3]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "活動日畫面"
description = "時間軸加「大日子」（3.3 的平日／假日旁）：清單分「查到原因的活動」與「原因未查證」，全城異常日也列；點了切到那天的 daily 資料。活動卡（共用 3.6 的卡內時間列）有那天整天進出曲線對照平常（短橫線，7.6 的每小時平常）、到場高峰「多了 N 人、是平常幾倍」、散場高峰時周邊 5 站的進站人數與倍數（7.6）、這一小時各區來的人並在地圖畫出流向（daily 的場館站來源行政區，AD-19）；全城異常日的卡顯示全線進站與倍數；散場高峰前後場館噴彩紙、小巨蛋打光。2.1 原型第四輪已涵蓋這個畫面並經走查（B1、B5、C3、G1、G2），不再另做 prototype。卡上所有寫到小時的地方（大標題、內文、卡內時間列）都跟畫面狀態的同一個 hour，到場與散場高峰另標「散場高峰 N 點」（走查 2026-11-11 小問題：大標題 16 點、時間列 14:00）；選的那天 date 寫進網址（AD-16，只由 state/url.ts 讀寫），活動卡標題列用 3.15 的分享鈕。"
verify = "在建置版點 9/13 看到小巨蛋站比平常多出的人數與倍數、散場高峰周邊 5 站、主要來源行政區；點一個原因未查證的全城異常日看到全線倍數；少於 10 人顯示「少於 10 人」；reduced-motion 時不自動播放、沒有彩紙；在活動卡換時段時大標題與時間列的小時一致；分享的連結打開回到同一天、同一張活動卡。"
covers = ["R1", "R3"]
after = [2, 3, 6, "3.3", "3.5", "3.6", "3.15"]
hitl = false
risk = "medium"

