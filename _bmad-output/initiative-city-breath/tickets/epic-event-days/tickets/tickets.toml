# 使用者看得到上個月哪幾天特別不一樣、為什麼 的 stories，依建置順序。2026-11-04 refine。

[[entry]]
id = 1
type = "story"
title = "異常日與 events.json"
description = "新增 pipeline/anomaly.py：依 AD-14 算全市級與站級異常日（平常＝同月同星期幾、排除當日的中位數），輸出 events.json 的 days 與 anomalies（eventIds 先為空），把契約寫進 docs/data-contract.md，並移除 v1 的 daily.json（AD-4 的假日檢查改讀 events.json）。這是本 epic 的 tracer bullet。"
verify = "2026-09 的 events.json 裡，9/13 小巨蛋站與 9/5 劍潭站出現在站級異常；全市級異常含 9/28 教師節；pytest 與 npm run build 通過。"
covers = ["R1"]
after = ["1.10"]
hitl = false
risk = "medium"

