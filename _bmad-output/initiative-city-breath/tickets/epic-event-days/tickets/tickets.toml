title = "場館檔期自動匯入"
description = "從臺北市資料大平臺抓小巨蛋場地租用、花博公園展館、中山堂演出的當月檔期快照到 data/raw/，對上 venues.csv 的車站，和站級異常日配對後寫進 events.json 的 events 與 eventIds；租用期含進場拆台，用期間內的站級尖峰判定演出日；定下站級異常門檻並寫回 architecture AD-14。"
