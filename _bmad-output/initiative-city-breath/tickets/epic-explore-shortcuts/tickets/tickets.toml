[[entry]]
id = 3
type = "story"
title = "城市徽章"
description = "8 個「之最」徽章（城市心臟、臥室之王、上班族大本營、假日人氣王、夜貓子、早起鳥、尖峰衝刺、祕境小站）由 web/src/data/badges.ts 用 traits.ts 從當月 stations.json 算出（AD-26）；地圖上發光的寶石是線索，收集冊有容易的謎題提示（Piwi 決定），選到那一站就解鎖、噴彩紙並開車站卡；進度只存 localStorage（AD-22，經 state/progress.ts 的同一個鍵），不能存時照常運作只是不保存；圖層面板加音效開關，預設關閉、WebAudio 合成、不載音檔（AD-24）。走查 2026-11-11 F4 與小問題：寶石放大並發光，點擊範圍至少 44px、優先於後面的行政區；點收集冊的勳章列，鏡頭飛到那顆寶石附近（不直接給答案，提示保持容易）；解鎖看畫面狀態裡選到的站，從地圖、找你的站、通勤起訖、皇冠或地標選到得主站都算。徽章是樂趣層，不擋主要流程（體驗原則 7）。上線時在提示清單（3.11）加一條「找找發光的寶石」，並在關於（3.17）「只存在這個瀏覽器」的說明加上徽章進度。原 3.9，2026-11-14 搬到本 epic。"
verify = "vitest：badges.ts 對 2026-09 選出的 8 站與手算一致；封鎖 localStorage 時仍能解鎖；重新整理後進度還在，progress 的其他欄位原樣保留；reduced-motion 時沒有彩紙、改成淡入。手機上點寶石周圍 44px 內都選到寶石而不是行政區；點勳章列鏡頭飛到寶石附近；從通勤選到得主站也解鎖；關於頁有徽章進度的說明。"
covers = ["R1"]
after = [2]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "活圖例：點圖例看場景示範"
description = "文字圖例（線寬、光點、顏色、柱高）已在階段 1 的 3.21；這張把它升級成點了會示範的活圖例（決定 22；走查 2026-11-11 F5；Piwi：有趣生動一點）。這是新畫面：先用 prototype 在 design/prototypes/8.4-live-legend/ 做三個可切換的版本給 Piwi 挑（hitl），例如 A 活圖例：點時間軸圖例的一項，場景裡對應的東西發光、放大、動一下（點「線寬」最粗的緞帶亮起並標出人數，點「寶石」最近的寶石彈一下）；B 可跳過的互動導覽：四、五步，每一步鏡頭飛到真的例子、請使用者自己點一下；C 點哪問哪：打開「這是什麼？」後點場景裡任何東西就說明它代表什麼。原型順便比較全城流向的橘色要不要和「誰來」的橘紅拉開；若改色，Piwi 定案後改 DESIGN.md 色票與 tokens。Piwi 選定後實作在 web/：入口在時間軸圖例旁與關於（3.17），提示（3.11）可以邀請但不強迫（體驗原則 7）；涵蓋線寬、光點、三種顏色、車站柱、寶石與皇冠；示範用的數字都從目前資料與 3.5 的公式算，不寫死；示意物件照 AD-23 標成示意、不出數字；有 reduced-motion 版本（不飛鏡頭、不彈跳，改成靜態標註）。原 3.19，2026-11-14 搬到本 epic 並改成活圖例。"
verify = "原型有三個可切換的版本，Piwi 選定並記在 DESIGN.md 互動；建置版裡線寬、光點、三種顏色、車站柱、寶石、皇冠都能在 1 次點擊內得到說明，且場景裡有對應的示範；示範的人數與圖例、畫面一致；隨時可跳過或關掉；reduced-motion 時沒有鏡頭飛行與彈跳，說明一樣完整。"
