[[entry]]
id = 6
type = "story"
title = "搭乘模式第 0 期：板南線試乘"
description = "平視搭乘模式規劃（原文 https://claude.ai/artifact/1yJ2ipJtfERZnRKSZqSfT5 ，Piwi 2026-11-14 核准）的第 0 期：先用現有場景驗證「坐在捷運上看台北」好不好玩，不需要新資料。從板南線的車站卡或路線按「搭這條線」進入搭乘鏡頭：沿 basemap.json 的真實軌道走（經 project() 與 elevation()，AD-12），在路線正上方約三層樓高、朝前略往下看；板南線幾乎全在地下，鏡頭照樣走地面、不做隧道。站與站之間照軌道等速前進，到站前減速停靠，停靠時開現有的車站卡（3.12，卡框 3.22），沿路是現有的示意積木（街廓、樹、列車、雲，AD-23），風格維持天光積木，不加新模型或新資料。控制只有三顆：暫停、下一站、下車（下車回到全景、播放維持暫停）；點擊目標 44px。減少動態時不做連續移動，改成一站一站跳（直接切換）。網址記得搭的線與位置（例如 ride=BL 與站，AD-16，只由 state/url.ts 讀寫），打開連結回到同一站、暫停中。頂埔段軌道是路網圖缺段以直線補的（basemap 標 approx，約 1.8 km）：先到資料裡找真實軌跡（例如 OpenStreetMap 的軌道線，授權與來源照 AD-21 由管線補進 basemap）；半天內補不到，第 0 期只搭到土城、頂埔不開放並在畫面上寫原因，不在直線上假裝真實沿線。關卡 A（hitl，Piwi 動手）：5 位試用者搭板南線，多數想搭完一整條線；iPhone 與中階 Android 用 6.4 的 `?debug=perf` 量搭乘全程平均 30 fps 以上（AD-6）。結果寫在 design/reviews/8.6-ride-trial.md，過了才規劃第 1 期（initiative Notes 的 Future）。後面幾期（板南線真實沿線、全路網、站外環顧）不在這張。"
verify = "建置版從板南線車站卡按「搭這條線」，鏡頭沿軌道在路線上方前進、到站減速並開那站的車站卡；只有暫停、下一站、下車三顆按鈕；reduced-motion 時一站一站跳、沒有連續移動；網址帶線與位置，用新分頁打開回到同一站且暫停；vitest：搭乘路徑的每一點都在 basemap 板南線軌道上（經 project()），頂埔段照票面二選一的結果處理（補了真實軌跡或終點是土城並有說明）；design/reviews/8.6-ride-trial.md 有 5 位試用者的結果與兩支手機的 fps，Piwi 寫明關卡 A 過或不過。"
covers = ["R3"]
after = [4, "3.12", "3.14", "3.22"]
hitl = true
risk = "medium"

