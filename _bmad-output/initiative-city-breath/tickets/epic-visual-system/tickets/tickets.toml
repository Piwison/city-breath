type = "story"
title = "微縮城市場景基底：台北盆地與天光"
description = "用 Three.js＋React Three Fiber 把 2.1 原型（天光）的底層移進 web/src/scene/，讀 1.12 的 basemap.json：projection.ts（含地形垂直誇張，AD-12）、useTokenColor（AD-8）；地形六層台地與海、三層底座地層、行政區薄片（districts.json）、河川與綠地、捷運路線（路線色 token）；天空依時刻內插、太陽東升西落並投影、夜裡換月光與星星、曝光與 NeutralToneMapping，材質顏色固定、日夜只靠光（DESIGN.md 天光）；圖層面板可開關河川、綠地、路線、區名；WebGL 不可用時有替代畫面。"
verify = "`npm run build` 後預覽看得到台北盆地地形、海、河川與捷運路線；拖動時間時太陽方位、天色與光色跟著變而材質顏色不變；reduced-motion 時不自動播放；vitest 比對 project() 的已知點與 elevation() 的誇張倍數。"
covers = ["R1", "R2"]
