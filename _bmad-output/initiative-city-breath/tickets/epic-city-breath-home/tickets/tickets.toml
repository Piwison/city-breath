# 城市觀察者看得到一整天各行政區之間的流動 的 stories，依建置順序。2026-11-10 replan（天光定案）。

[[entry]]
id = 5
type = "story"
title = "行政區流向緞帶"
description = "首頁換成 2.3 的場景並自動播放全城一天（48 秒、從清晨開始，手指碰到就暫停）：行政區之間的流向用緞帶與光點表示，線寬與人數成正比、尾端箭頭、全市只畫前 12 大、前三大在弧頂標人數，一顆光點代表固定人數，時間軸下方的圖例用同一個公式；平日／假日可切換；移除骨架的 maplibre-gl 與 deck.gl。這是本 epic 的 tracer bullet。"
verify = "首頁開啟就自動播放，8 點平日可看到永和往中山、中正、大安、信義的流向；切換假日流向改變；圖例的粗細和畫面一致；reduced-motion 時不自動播放；package.json 沒有 maplibre-gl 與 deck.gl。"
covers = ["R1", "R4"]
after = ["1.9", "2.3"]
hitl = false
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "時間軸播放與日型切換"
description = "下方時間軸：播放／暫停、目前時間、平日／假日、天色漸層的拖曳條、圖例位置，播放中跨進新時段時上方浮出時段名稱；時間軸與小時存在 web/src/state/ 的單一畫面狀態並同步到網址；reduced-motion 時不自動播放、直接切換（architecture AD-8、AD-16；DESIGN.md 互動、版面）。「大日子」入口由 7.4 加。"
verify = "手機上播放不卡頓，可切換日型，拖動時天色跟著時刻變；網址帶 hour 與 dayType，重新整理後回到同一刻。"
covers = ["R1"]
after = ["2.2"]
hitl = false
risk = "low"
v6_key = "2-3"

[[entry]]
id = 6
type = "story"
title = "點行政區看去哪、誰來並展開站"
description = "點一個行政區彈出小卡：「這一小時／整天」切換、去哪與誰來前 3（點了飛到那條緞帶）、這區此刻最忙的車站，並展開該區的站；小卡蓋住時間軸時卡內有一列「‹ 時間 ›＋平日／假日」，這列與小卡外框做成共用元件，之後的車站、通勤、地標、活動卡都用它（走查共通問題 1、3）。"
verify = "點大安區、假日、整天看到前幾名目的地為中正、大安、信義（與 2026-09 查核一致）；小卡開著也能換時段與平假日；站點展開且可再點站。"
covers = ["R2"]
after = [5, 3]
hitl = false
risk = "medium"

[[entry]]
id = 1
type = "story"
title = "車站柱與站珠"
description = "展開一個行政區或放大到一定程度時，每站是「廣場＋細柱＋站珠」：柱高＝該小時進出人數、站珠是所屬路線色（basemap.json 的站所屬路線），只標重要站名避免一片字；點站時鏡頭飛過去、站珠彈一下。"
verify = "切換小時時柱高更新；選區或放大後點得到站，站名不重疊；reduced-motion 時沒有彈跳。"
covers = ["R1"]
after = [6]
hitl = false
risk = "low"
v6_key = "2-1"

[[entry]]
id = 12
type = "story"
title = "車站卡"
description = "點站開啟車站卡（共用 3.6 的卡內時間列）：這一站的個性（web/src/data/traits.ts 從 stations.json 挑這站在全線排名前 20 的兩個特質：假日倍數、早上進出比、晚上占比、清晨占比、人次）、進站與出站、整天長條（點了跳到那個時段）、這一小時前 5 目的地（od 分片）並在地圖畫出站對站緞帶、這 5 站加總成「去哪幾區」，以及「從這站找通勤」按鈕（把起站寫進畫面狀態，4.1 的入口接手）；環狀線站顯示出站未入檔。類型標籤、一句話、整天前 10、同類型站與誰來這站由 epic-station-personality 加進同一張卡（走查 A4、C4、C5）。"
verify = "點任一站平日 8 點看到個性、進出、前 5 目的地與去哪幾區，數字與 stations.json、od 分片一致（vitest 測 traits.ts）；少於 10 人顯示「少於 10 人」；點環狀線站看到出站未入檔的說明。"
covers = ["R1", "R2"]
after = [1]
hitl = false
risk = "medium"

