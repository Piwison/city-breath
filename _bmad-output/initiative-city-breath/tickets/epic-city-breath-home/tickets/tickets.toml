# 城市觀察者看得到一整天各行政區之間的流動 的 stories，依建置順序。2026-11-10 replan（天光定案），2026-11-11 replan（第一次使用者走查：分享與網站說明提前到車站卡之後）。

[[entry]]
id = 5
type = "story"
title = "行政區流向緞帶"
description = "首頁換成 2.3 的場景並自動播放全城一天（48 秒、從清晨開始，手指碰到就暫停；Piwi 2026-11-11 決定維持清晨開場）：行政區之間的流向用緞帶與光點表示，線寬與人數成正比、尾端箭頭、全市只畫前 12 大、前三大在弧頂標人數，一顆光點代表固定人數，時間軸下方的圖例用同一個公式；平日／假日可切換；移除骨架的 maplibre-gl 與 deck.gl。鏡頭照地圖習慣（Piwi 2026-11-11 決定 2；走查 F2）：單指平移、雙指縮放＋旋轉／傾斜，縮放朝雙指中心，傾角有上下限（不會翻到只剩天空或貼平地面），平移不離開沙盤，畫面上有「回到全景」鈕一點飛回開場構圖。放大時緞帶的螢幕寬度有上限、不蓋住街區，弧頂的人數標籤避開上方 HUD 與時間軸、不被畫面邊緣切掉（走查 F8）。這是本 epic 的 tracer bullet。"
verify = "首頁開啟就自動播放，8 點平日全市前 12 大流向與原型一致（板橋→中正、中正→大安、板橋→中山為前三）；切換假日流向改變；圖例的粗細和畫面一致；reduced-motion 時不自動播放；package.json 沒有 maplibre-gl 與 deck.gl。手機上單指拖曳是平移、雙指可縮放與旋轉且縮放朝手指，傾角翻不過上下限，「回到全景」回到開場構圖；放到最大時緞帶不蓋住整條街廓，標籤都在上方 HUD 與時間軸之間的可視區內。"
covers = ["R1", "R4"]
after = ["1.9", "2.3"]
hitl = false
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "時間軸播放與日型切換"
description = "下方時間軸：播放／暫停、目前時間、平日／假日、天色漸層的拖曳條、圖例位置，播放中跨進新時段時上方浮出時段名稱；時間軸與小時存在 web/src/state/ 的單一畫面狀態並同步到網址；reduced-motion 時不自動播放、直接切換（architecture AD-8、AD-16；DESIGN.md 互動、版面）。圖例文字由目前模式決定，全城時寫「橘＝全城流向」，3.6 加上選區模式的「藍＝這區的人去哪、橘紅＝誰來這裡」（走查 2026-11-11 F5）。「靜態模式」按下要有看得到的改變：停止播放、停在 8 點、光點換成依人數分級的光帶，按鈕顯示目前開或關（走查小問題）。「大日子」入口由 7.4 加。"
verify = "手機上播放不卡頓，可切換日型，拖動時天色跟著時刻變；網址帶 hour 與 dayType，重新整理後回到同一刻。全城模式的圖例寫明顏色代表什麼；按下靜態模式後畫面立刻停在 8 點、光點換成光帶、按鈕顯示已開啟。"
covers = ["R1"]
after = ["2.2"]
hitl = false
risk = "low"
v6_key = "2-3"

[[entry]]
id = 6
type = "story"
title = "點行政區看去哪、誰來並展開站"
description = "點一個行政區彈出小卡：「這一小時／整天」切換、去哪與誰來前 3（點了飛到那條緞帶）、這區此刻最忙的車站，並展開該區的站；小卡蓋住時間軸時卡內有一列「‹ 時間 ›＋平日／假日」，這列與小卡外框做成共用元件，之後的車站、通勤、地標、活動卡都用它（走查共通問題 1、3）。共用卡框也負責：任何小卡打開就暫停播放、關掉後維持暫停，卡上標明正在看的時段與日型（例如「平日 8 點」「假日整天」）（走查 2026-11-11 F1）。區卡的站列表數字標明「此刻進出 N 人」，卡內標明藍＝這區的人去哪、橘紅＝誰來這裡，圖例同步換成選區模式（走查 F5、小問題）。"
verify = "點大安區、假日、整天看到前幾名目的地為中正、大安、信義（與 2026-09 查核一致）；點永和區、平日 8 點，去哪前幾名為中正、中山、大安、信義（2026-09：1,505／1,411／1,026／756）；小卡開著也能換時段與平假日；站點展開且可再點站。播放中點大安區時間就停住、卡上寫著時段與日型；站列表的數字後面有「人」；選區後圖例寫著藍是去哪、橘紅是誰來。"
covers = ["R2"]
after = [5, 3]
hitl = false
risk = "medium"

