[[entry]]
id = 13
type = "story"
title = "街廓建築與樹（示意）"
description = "整座城共用一張方格街廓，每格疏密依附近車站全日人數、整區高度隨此刻進出人數起伏；山上（basemap.json 等級格網 40 公尺以上）不蓋房子、成片種樹，公園種樹，河上與站前廣場不蓋；矮胖圓角積木、三種牆色、窗戶入夜亮燈深夜漸少；全部用 InstancedMesh，不顯示任何數字、圖例標成示意（AD-23）；圖層面板可關掉建築。"
