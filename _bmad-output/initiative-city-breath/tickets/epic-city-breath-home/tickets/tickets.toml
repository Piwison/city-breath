[[entry]]
id = 17
type = "story"
title = "關於與資料來源"
description = "上方第一排固定一個「關於」，任何時候一點就開（走查 2026-11-11 B2、F7）：網站名與一句話、資料月份，以及原 6.1 的內容：出處、授權、OD 是進出站配對而非實際路徑、少於 10 人規則與環狀線限制、活動日資料的出處（臺北市資料大平臺的場館檔期、人工補的活動與來源網址）；來源清單只從 meta.json 與 basemap.json 的 sources 產生（含 Copernicus DEM、捷運路網圖、河川、綠地、班距、地標位置、場館檔期快照），並說明畫面上哪些是示意（街廓、樹、地標造型、列車位置、雲）。各卡片底部的來源小字收成一行「資料：YYYY 年 M 月・來源 ›」連到這裡。開場說明（3.11）收起後，網站名與一句話在這裡隨時看得到。徽章進度只存在瀏覽器的說明由 3.9 上線時加。上方第一排的位置和 3.15 的「分享這一刻」一起排，接在它之後做。2026-11-11 由 epic-source-and-launch 6.1 移來。"
