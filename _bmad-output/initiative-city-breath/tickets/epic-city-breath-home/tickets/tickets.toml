description = "8 個「之最」徽章（城市心臟、臥室之王、上班族大本營、假日人氣王、夜貓子、早起鳥、尖峰衝刺、祕境小站）由 web/src/data/badges.ts 用 traits.ts 從當月 stations.json 算出（AD-26）；地圖上發光的寶石是線索，收集冊有容易的謎題提示（Piwi 決定），選到那一站就解鎖、噴彩紙並開車站卡；進度只存 localStorage（AD-22），不能存時照常運作只是不保存；圖層面板加音效開關，預設關閉、WebAudio 合成、不載音檔（AD-24）。走查 2026-11-11 F4 與小問題：寶石放大並發光，點擊範圍至少 44px、優先於後面的行政區；點收集冊的勳章列，鏡頭飛到那顆寶石附近（不直接給答案，提示保持容易）；解鎖看畫面狀態裡選到的站，從地圖、找車站、通勤起訖、皇冠或地標選到得主站都算。上線時把第一次提示（3.11）加上「發光的寶石」，並在關於（3.17）加上徽章進度只存在瀏覽器的說明。"
verify = "vitest：badges.ts 對 2026-09 選出的 8 站與手算一致；封鎖 localStorage 時仍能解鎖；重新整理後進度還在；reduced-motion 時沒有彩紙、改成淡入。手機上點寶石周圍 44px 內都選到寶石而不是行政區；點勳章列鏡頭飛到寶石附近；從通勤選到得主站也解鎖；關於頁有徽章進度的說明。"
