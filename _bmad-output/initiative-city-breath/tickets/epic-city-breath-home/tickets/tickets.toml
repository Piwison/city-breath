description = "每張卡都帶得走（體驗原則 6；走查 2026-11-11 B1：找不到任何分享入口、網址不記狀態）。分享鈕在共用卡框（3.22）的標題列，沒開卡時上方有「分享這一刻」（位置照 DESIGN.md 版面，HUD 仍不超過畫面 35%）；按了先開分享面板，不直接叫系統分享（決定 17）：面板有卡片預覽、「存成圖片」與「複製連結」，複製後提示「已複製」。這張做面板、連結與共用的接口；有圖可存的卡由各自的票把內容接進面板的預覽與「存成圖片」（行政區卡 3.16、通勤卡 4.2、活動卡 7.7），車站卡與「分享這一刻」只有複製連結（Piwi 2026-11-11：不做車站卡分享圖）。網址記 month、dayType、hour、district、station（AD-16，只由 web/src/state/url.ts 讀寫；hour 與 dayType 3.3 已做），打開連結時還原到同一個站或行政區、同一時段與日型並開好那張卡、暫停在那一刻，不從清晨重播；值不合法或站不存在時退回首頁全景並顯示可讀訊息。連結預覽（決定 20，核心旅程第 1 步）：全站一張固定的預覽圖、標題「城市呼吸｜上個月的台北捷運」與一句描述（Open Graph 與 Twitter card），加上網站圖示；預覽圖是放在 web/public/ 的靜態檔，不截場景；預覽用的絕對網址在建置時由 `VITE_SITE_URL` 寫進 index.html（AD-18），沒設時用相對路徑。分享圖的版型（4.3 的 web/src/share/render.ts）照決定 16、18、19 調整：只印短網址、不放 QR code；上方天空帶放網站名、下方留白（IG 介面會蓋住）；數字與英文用自帶字型（只含數字與拉丁字的子集，開放授權，放在 web/public/、不向外部網址載入，AD-1；授權列進來源清單），中文用系統字型。"
verify = "vitest：url.ts 對 month、dayType、hour、district、station 序列化再讀回一致，不合法的值退回預設。建置版打開大安區、假日、14 點按分享，看到面板與「複製連結」，複製的連結用新分頁打開是同一張卡、同一時段、播放暫停；車站卡的面板沒有「存成圖片」；沒開卡時「分享這一刻」複製的是目前的時段與日型。建置出的 index.html 有 og:title「城市呼吸｜上個月的台北捷運」、og:description、og:image 與 twitter:card，預覽圖與網站圖示的檔案存在（建置後檢查）。分享圖上只有短網址、沒有 QR code，上方有網站名、下方留白；render 測試確認數字用自帶字型的字族；建置產物沒有對外部字型網址的請求。"
covers = ["R5", "R6"]
after = [3, 6, 12, 22]
hitl = false
risk = "medium"

