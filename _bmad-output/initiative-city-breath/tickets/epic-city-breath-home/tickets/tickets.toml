description = "點站開啟車站卡（共用 3.6 的卡框與卡內時間列，打開就暫停播放、卡上標明時段與日型，走查 2026-11-11 F1）：這一站的個性（web/src/data/traits.ts 從 stations.json，AD-26， 挑這站在全線排名前 20 的兩個特質：假日倍數、早上進出比、晚上占比、清晨占比、人次）、進站與出站、整天長條（點了跳到那個時段）、這一小時前 5 目的地（od 分片）並在地圖畫出站對站緞帶、這 5 站加總成「去哪幾區」，以及「從這站找通勤」按鈕（把起站寫進畫面狀態，4.1 的入口接手）；環狀線站顯示出站未入檔。類型標籤、一句話、整天前 10、同類型站與誰來這站由 epic-station-personality 加進同一張卡（走查 A4、C4、C5）。"
