title = "怎麼看這張圖"
description = "說明線寬、光點、顏色（全城／去哪／誰來）、車站柱、寶石與皇冠各代表什麼，在場景裡示範、不只是文字（走查 2026-11-11 F5；Piwi：有趣生動一點）。這是新畫面：先用 prototype 在 design/prototypes/3.19-how-to-read/ 做 2–3 個可切換的版本給 Piwi 選（hitl 步驟），例如 A 活圖例：點時間軸圖例的一項，場景裡對應的東西發光、放大、動一下（點「線寬」最粗的緞帶亮起並標出人數，點「寶石」最近的寶石彈一下）；B 可跳過的互動導覽：四、五步，每一步鏡頭飛到真的例子、請使用者自己點一下；C 點哪問哪：打開「這是什麼？」後點場景裡任何東西就說明它代表什麼。原型順便比較全城流向的橘色要不要和「誰來」的橘紅拉開；若改色，Piwi 定案後改 DESIGN.md 色票與 tokens。Piwi 選定後實作在 web/：入口在時間軸圖例旁與關於（3.17），開場說明（3.11）可以邀請但不強迫；示範用的數字都從目前資料與 3.5 的公式算，不寫死；示意物件照 AD-23 標成示意、不出數字；有 reduced-motion 版本（不飛鏡頭、不彈跳，改成靜態標註）。"
verify = "原型有 2–3 個可切換的版本，Piwi 選定並記在 DESIGN.md 互動；建置版裡線寬、光點、三種顏色、車站柱、寶石、皇冠都能在 1 次點擊內得到說明，且場景裡有對應的示範；示範的人數與圖例、畫面一致；隨時可跳過或關掉；reduced-motion 時沒有鏡頭飛行與彈跳，說明一樣完整。"
covers = ["R10"]
after = [9, 11]
hitl = true
risk = "medium"

