title = "列車與雲（示意）"
description = "列車沿真實軌道雙向跑，同線列車間隔依 basemap.json 的官方班距（平日／假日、尖峰較密），營運時間外沒有列車，環狀線不在班距資料內不畫；6 點第一班車時各站從台北車站往外一圈圈亮起；雲在白天飄過並投影，放大時淡出；列車與雲的位置是示意、不承載數字（AD-23），reduced-motion 時靜止。"
