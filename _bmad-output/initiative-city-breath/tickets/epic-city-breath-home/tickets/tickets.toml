[[entry]]
id = 15
type = "story"
title = "分享入口與網址記狀態"
description = "第一次來的人找不到任何分享入口、網址不記狀態（走查 2026-11-11 B1）。分享鈕做在 3.6 的共用卡框標題列，所以每張小卡（行政區、車站、通勤、地標、活動）都有，沒開卡時上方第一排有「分享這一刻」（位置照 DESIGN.md 版面，HUD 仍不超過畫面 35%）；分享用 Web Share API，不支援時複製連結並提示「已複製」。網址記 month、dayType、hour、district、station（AD-16，只由 web/src/state/url.ts 讀寫；hour 與 dayType 3.3 已做），打開分享的連結時還原到同一個站或行政區、同一時段與日型並開好那張卡、暫停在那一刻，不從清晨重播；網址的值不合法或站不存在時退回首頁全景並顯示可讀訊息。有圖可存的卡由各自的票把「存成圖片」接進同一個分享選單：行政區卡 3.16、通勤卡 4.2、活動卡 7.7；車站卡只分享連結（Piwi 2026-11-11：先不做車站卡分享圖）。分享次數由 4.4 計數。"
verify = "vitest：url.ts 對 month、dayType、hour、district、station 序列化再讀回一致，不合法的值退回預設；在建置版打開大安區、假日、14 點並分享，用新分頁開那個連結看到同一張卡、同一時段、播放暫停；車站卡分享的連結打開同一站；不支援 Web Share 的瀏覽器會複製連結並提示；沒開卡時「分享這一刻」分享的是目前的時段與日型。"
covers = ["R5"]
after = [3, 6, 12]
hitl = false
risk = "medium"

