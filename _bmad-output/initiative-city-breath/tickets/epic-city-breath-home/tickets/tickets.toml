[[entry]]
id = 17
type = "story"
title = "關於與資料來源"
description = "上方固定一個「關於」，任何時候一點就開（走查 2026-11-11 B2、F7）：網站名與一句話、資料月份，以及原 6.1 的內容：出處、授權、OD 是進出站配對而非實際路徑、少於 10 人規則與環狀線限制、活動日資料的出處。來源清單從資料檔自動列出（產品計畫 v2）：只由 meta.json 與 basemap.json 的 sources 產生（含 Copernicus DEM、捷運路網圖、河川、綠地、班距、地標位置、場館檔期快照），不手寫；並說明畫面上哪些是示意（街廓、樹、地標造型、列車位置、雲）。決定 26 的說明文字寫清楚：人數怎麼進位、沒有車站的區、支線班距、0 點的列車、淡水地標的位置、市界外的綠地；決定 15：行政區照官方界線，和直覺不同的站（例如中山站在大同區）在這裡與行政區卡各加一句註。「只存在這個瀏覽器」的說明列出目前會存的東西（最近用過的站 4.1，已上線才列；之後的我的站 3.23、徽章 8.3 上線時各自加一行）。各卡片底部的來源小字收成一行「資料：YYYY 年 M 月・來源 ›」連到這裡。網站名與一句話在這裡隨時看得到。接在 3.15、3.16 之後做（都改共用卡框與上方那一排）。2026-11-11 由 epic-source-and-launch 6.1 移來。"
