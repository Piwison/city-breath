description = "首頁、通勤卡、活動日三個 epic 都完成後，把 6.2 的預覽部署轉成正式上線：拿掉 vercel.json 的 noindex；要不要綁自訂網域由 Piwi 決定（綁了也保留 *.vercel.app，預覽期分享出去的連結仍打得開，AD-18）。上線前檢查：「關於與資料來源」（3.17）列齊上線當月所有 epic 用到的來源（meta.json 與 basemap.json 的 sources，含活動日的場館檔期與人工補的來源）、四項說明與環狀線限制；從行政區卡、車站卡、通勤卡、活動卡與「分享這一刻」各分享一次，連結在正式網址打開回到同一個畫面，存成的圖上網址是正式網址；Piwi 再用 iPhone 做一次 AD-6 實測（含街廓、列車、徽章都上線後的完整場景），有中階 Android 也一起測，結果寫進 design/reviews/；Vercel Web Analytics 收得到 4.4 的事件。"
verify = "正式網址回應不再帶 X-Robots-Tag: noindex；關於頁的來源清單與所有月份的 meta.json、basemap.json 的 sources 一致；五種分享入口的連結在正式網址都回到同一個畫面；Piwi 的上線前實測紀錄在 design/reviews/；分析工具看得到下載與分享事件。"
