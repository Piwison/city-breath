hitl = true
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "正式上線"
description = "階段 2 的票做完、關卡 2 通過（6.5 的冒煙測試與獨立審查、6.6 的真人測試）後，把 6.2 的預覽部署轉成正式上線；不再等首頁、通勤卡、活動日三個 epic 全部完成（產品計畫 v2：大日子、我的站、探索捷徑、車站個性排在上線後）。拿掉 vercel.json 的 noindex；要不要綁自訂網域由 Piwi 決定（hitl；綁了也保留 *.vercel.app，預覽期分享出去的連結仍打得開，AD-18），綁了就改 `VITE_SITE_URL`。上線前檢查：「關於與資料來源」（3.17）列齊上線當月用到的來源、四項說明與環狀線限制；從行政區卡、車站卡、通勤卡與「分享這一刻」各分享一次，連結在正式網址打開回到同一個畫面，存成的圖上網址是正式網址，貼到 LINE 有預覽圖；6.4 之後場景有改的話，Piwi 再用手機看一次 `?debug=perf`；Vercel Web Analytics 收得到開卡、通勤與分享事件。上線日記在 initiative Notes，關卡 3（上線滿一個月看五個指標）從那天起算；上線後由 Sofia 移除階段 3 第一張票的 unknown。"
verify = "正式網址回應不再帶 X-Robots-Tag: noindex；關於頁的來源清單與所有月份的 meta.json、basemap.json 的 sources 一致；四種分享入口的連結在正式網址都回到同一個畫面，LINE 的預覽出得來；分析工具看得到開卡、通勤與分享事件；上線日記在 initiative Notes。"
covers = ["R1"]
after = [2, 5, 6]
hitl = true
risk = "low"
