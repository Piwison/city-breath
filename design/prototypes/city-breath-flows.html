<title>城市呼吸 人潮流向</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 一個畫面的 app：3D 微縮城市上，光點從出發區飛向目的區。顏色隨時間由 JS 改寫 token。 */
:root{
  --sky-top:#BFE0F6; --sky-low:#EAF4F7;
  --ink:#14182A; --ink-soft:#3F4A62; --ink-on:#F7F4EC;
  --glass:rgba(255,255,255,.66); --glass-line:rgba(20,30,60,.12);
  --from:#2F8FD8; --to:#F08A24; --track:rgba(20,30,60,.14);
  --font-num:"Geist",ui-sans-serif,system-ui,sans-serif;
  --font-text:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--sky-low);color:var(--ink);font-family:var(--font-text);-webkit-tap-highlight-color:transparent}
#scene{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
.boot[hidden]{display:none}
.boot{position:fixed;inset:0;display:grid;place-items:center;font-size:15px;color:var(--ink-soft);pointer-events:none}
.hud{position:fixed;left:0;right:0;top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));text-align:center}
.clock{font-family:var(--font-num);font-weight:600;font-size:clamp(44px,10vw,64px);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;text-shadow:0 2px 20px var(--glow,rgba(255,255,255,.7))}
.when{font-weight:700;font-size:15px;text-shadow:0 1px 12px var(--glow,rgba(255,255,255,.7))}
.legend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-soft)}
.legend i{display:inline-block;width:64px;height:6px;border-radius:999px;background:linear-gradient(90deg,var(--from),var(--to))}
.tags{position:fixed;inset:0;pointer-events:none}
.tag{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;border:1px solid var(--glass-line);background:var(--glass);color:var(--ink);font:700 12px/1 var(--font-text);padding:7px 9px;border-radius:999px;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:transform .15s ease,background .2s ease,color .2s ease;white-space:nowrap;min-height:28px}
.tag:active{transform:translate(-50%,-50%) scale(.94)}
.tag[aria-pressed="true"]{background:var(--ink);color:var(--ink-on);border-color:var(--ink)}
.tag.event{background:var(--to);color:#1a1205;border-color:transparent}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 2*max(16px,env(safe-area-inset-left,0px))));display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:24px;background:var(--glass);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-sizing:border-box}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.play{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--ink);color:var(--ink-on);display:grid;place-items:center;cursor:pointer;transition:transform .12s ease}
.play:active{transform:scale(.94)} .play svg{width:16px;height:16px}
.story{margin:0;font-size:14px;line-height:1.4;font-weight:500;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.time{position:relative}
.time .track{position:absolute;left:0;right:0;top:10px;height:8px;border-radius:999px}
.time input{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;position:relative}
.time input::-webkit-slider-runnable-track{height:8px;background:transparent}
.time input::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--ink);margin-top:-8px;box-shadow:0 2px 10px rgba(0,0,0,.28)}
.time input::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--ink)}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -4px;padding:2px 4px}
.seg::-webkit-scrollbar{display:none}
.seg .sep{flex:none;width:1px;background:var(--glass-line);margin:4px 2px}
.seg button{flex:none;min-height:38px;padding:0 13px;border-radius:999px;border:1px solid var(--glass-line);background:transparent;color:var(--ink);font:500 14px/1.2 var(--font-text);cursor:pointer;transition:background .2s ease,color .2s ease,transform .12s ease;text-align:left}
.seg button:active{transform:scale(.96)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ink-on);border-color:var(--ink)}
.seg button small{display:block;font-size:11px;opacity:.75;font-weight:400}
.label{font-size:12px;color:var(--ink-soft)}
.card{position:fixed;left:50%;transform:translate(-50%,-8px);opacity:0;top:calc(env(safe-area-inset-top,0px) + 112px);width:min(380px,calc(100% - 32px));max-height:min(36vh,300px);overflow:auto;padding:14px 16px;border-radius:20px;background:var(--glass);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);transition:opacity .2s ease,transform .25s cubic-bezier(.2,.8,.2,1);pointer-events:none;box-sizing:border-box}
.card.open{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.card h2{margin:0 36px 6px 0;font-size:16px;text-wrap:balance}
.close{position:absolute;right:8px;top:8px;width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:var(--ink);cursor:pointer;font-size:18px}
.mini{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.mini button{min-height:32px;padding:0 11px;border-radius:999px;border:1px solid var(--glass-line);background:transparent;color:var(--ink);font:500 13px/1 var(--font-text);cursor:pointer}
.mini button[aria-pressed="true"]{background:var(--ink);color:var(--ink-on);border-color:var(--ink)}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.rank li{display:grid;grid-template-columns:4.2em minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px}
.rank .b{height:10px;border-radius:999px;background:linear-gradient(90deg,var(--from),var(--to));transform-origin:left;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.rank .n{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink-soft);text-align:right;min-width:7.5em}
.note{margin:8px 0 0;font-size:12px;line-height:1.5;color:var(--ink-soft)}
.badge{display:inline-block;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--track);margin-right:6px}
.big{font-family:var(--font-num);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums}
.card a{color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.card,.play,.seg button,.tag,.rank .b{transition:none}}
</style>

<canvas id="scene" aria-label="台北捷運人潮流向：光點從出發的行政區飛向目的地"></canvas>
<div class="boot" id="boot">載入城市中…</div>

<header class="hud">
  <div class="clock" id="clock">08:00</div>
  <div class="when" id="when">平日平均</div>
  <div class="legend"><span>出發</span><i></i><span>抵達</span><span id="scaleNote"></span></div>
</header>
<div class="tags" id="tags"></div>

<section class="card" id="card" aria-live="polite">
  <button class="close" id="cardClose" type="button" aria-label="關閉">×</button>
  <div id="cardBody"></div>
</section>

<section class="dock" id="dock" aria-label="時間與日子">
  <div class="row">
    <button class="play" id="play" type="button" aria-label="播放一整天"><svg id="playIcon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1 L15 8 L3 15 Z" fill="currentColor"/></svg></button>
    <p class="story" id="story"></p>
  </div>
  <div class="time">
    <div class="track" id="dayTrack" aria-hidden="true"></div>
    <label for="hour" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">時間</label>
    <input id="hour" type="range" min="0" max="23.99" step="0.01" value="8">
  </div>
  <div class="seg" aria-label="哪一天">
    <span role="group" aria-label="平日或假日" id="days" style="display:flex;gap:6px">
      <button type="button" data-day="weekday" aria-pressed="true">平日</button>
      <button type="button" data-day="holiday" aria-pressed="false">假日</button>
    </span>
    <span class="sep" aria-hidden="true"></span>
    <span role="group" aria-label="九月的特別日子" id="events" style="display:flex;gap:6px"></span>
  </div>
  <div class="seg" role="group" aria-label="試試看" id="asks">
    <button type="button" data-ask="yonghe">永和的人去哪上班？</button>
    <button type="button" data-ask="daan">大安的人假日去哪？</button>
    <button type="button" data-ask="ive">IVE 演唱會的人從哪來？</button>
  </div>
</section>

function arcFor(key,a,b){ let f=arcs.get(key); if(f) return f;
  const dist=a.distanceTo(b); const mid=a.clone().add(b).multiplyScalar(.5); mid.y=1.6+dist*.42;
  const curve=new THREE.QuadraticBezierCurve3(a.clone().setY(.4),mid,b.clone().setY(.4));
  const pts=curve.getPoints(40); const g=new THREE.BufferGeometry().setFromPoints(pts);
  const col=new Float32Array(pts.length*3); g.setAttribute('color',new THREE.BufferAttribute(col,3));
  const line=new THREE.Line(g,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:0,depthWrite:false,toneMapped:false}));

  return {top:lerpHex(A[0],B[0],t),low:lerpHex(A[1],B[1],t),ground:lerpHex(A[3],B[3],t),river:lerpHex(A[4],B[4],t),hill:lerpHex(A[5],B[5],t),night:A[2]+(B[2]-A[2])*t}; }

function flowMapAt(h){ const a=Math.floor(h)%24, b=(a+1)%24, t=h-Math.floor(h); const m=new Map();
  for(const [o,d,n] of flowsAt(a)) m.set(o*100+d,(1-t)*n);
  for(const [o,d,n] of flowsAt(b)) m.set(o*100+d,(m.get(o*100+d)||0)+t*n); return m; }
function sumFlows(fn){ const m=new Map(); const src = S.event>=0 ? EV[S.event].flows : F.avg[S.day];
  const hours = S.scope==='day' ? [...Array(24).keys()] : [Math.floor(S.hour)%24];
  for(const h of hours) for(const [o,d,n] of (src[h]||[])) if(fn(o,d)) { const k=o*100+d; m.set(k,(m.get(k)||0)+n); } return m; }

function rankHtml(m,self){ const rows=[...m.entries()].sort((a,b)=>b[1]-a[1]); const tot=rows.reduce((s,r)=>s+r[1],0)||1;
  const max=rows[0]?rows[0][1]:1; return '<ol class="rank">'+rows.slice(0,5).map(([k,n])=>{ const other = S.dir==='out' ? k%100 : Math.floor(k/100);

    return '<li><span>'+nm+'</span><span class="b" style="transform:scaleX('+(n/max).toFixed(3)+')"></span><span class="n">'+fmt(n)+' 人・'+Math.round(n/tot*100)+'%</span></li>'; }).join('')+'</ol>'; }
function renderCard(){ const card=$('card'), body=$('cardBody');
  if(S.sel<0 && S.event<0){ card.classList.remove('open'); return; }
  const hh=String(Math.floor(S.hour)%24).padStart(2,'0'); let html='';
  if(S.sel>=0){ const i=S.sel, name=F.districts[i];
    const m=sumFlows((o,d)=> S.dir==='out' ? o===i : d===i);
    const when = S.event>=0 ? dateLabel(EV[S.event].date) : (S.day==='weekday'?'平日平均':'假日平均');
    html+='<h2>'+(S.dir==='out' ? name+'的人去哪裡' : '誰來'+name)+'</h2>';
    html+='<div class="mini" role="group" aria-label="方向"><button type="button" data-dir="out" aria-pressed="'+(S.dir==='out')+'">去哪裡</button><button type="button" data-dir="in" aria-pressed="'+(S.dir==='in')+'">從哪來</button>'
      +'<button type="button" data-scope="hour" aria-pressed="'+(S.scope==='hour')+'">'+hh+':00 這一小時</button><button type="button" data-scope="day" aria-pressed="'+(S.scope==='day')+'">全天</button></div>';
    html+=rankHtml(m,i);
    html+='<p class="note">'+when+'，'+(S.dir==='out'?'從':'抵達')+name+'的 '+F.cent[i][2]+' 個捷運站'+(S.dir==='out'?'出發':'')+'的人次。行政區依車站位置歸類，待核對。</p>'; }
  else { const e=EV[S.event]; const h=Math.floor(S.hour)%24; const ex=e.exits[h], base=e.base[h];
    const arr=e.arrive[h]||[]; const tot=arr.reduce((s,r)=>s+r[1],0)||1;
    html+='<h2>'+dateLabel(e.date)+' '+e.st+'站</h2>';
    html+='<p style="margin:0 0 8px"><span class="badge">'+(e.verified?'已查證':'原因待確認')+'</span>'+e.label+'</p>';
    html+='<div class="row" style="align-items:baseline;gap:8px"><span class="big">'+fmt(ex)+'</span><span>人在 '+String(h).padStart(2,'0')+':00 出站</span></div>';
    html+='<p class="note" style="margin-top:2px">平常同一個星期幾、同一小時約 '+fmt(base)+' 人'+(base>0&&ex>base?'，多了 '+fmt(ex-base)+' 人（'+(ex/base).toFixed(1)+' 倍）':'')+'。</p>';
    html+='<div class="label" style="margin-top:8px">這一小時抵達的人從哪裡來</div><ol class="rank">'+arr.slice(0,5).map(([o,n])=>'<li><span>'+F.districts[o]+'</span><span class="b" style="transform:scaleX('+(n/(arr[0]?arr[0][1]:1)).toFixed(3)+')"></span><span class="n">'+fmt(n)+' 人・'+Math.round(n/tot*100)+'%</span></li>').join('')+'</ol>';
    html+='<p class="note">'+e.note+(e.src?'。<a href="'+e.src+'" target="_blank" rel="noopener">新聞來源</a>':'')+'</p>'; }
  body.innerHTML=html; card.classList.add('open');
  body.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>{ S.dir=b.dataset.dir; renderCard(); }));
  body.querySelectorAll('[data-scope]').forEach(b=>b.addEventListener('click',()=>{ S.scope=b.dataset.scope; renderCard(); }));

function setHud(){ const hi=Math.floor(S.hour)%24, mm=Math.floor((S.hour-hi)*6)*10;

  let s;
  if(!fl.length) s='凌晨 2 點到 5 點停駛，城市在睡覺。';
  else if(e) s='這一小時有 '+fmt(moving)+' 人跨區移動。橘色標籤是活動地點，光點是往那裡去的人。';
  else s='這一小時有 '+fmt(moving)+' 人搭捷運跨區移動。點地圖上的行政區，看那裡的人去哪。';

$('hour').addEventListener('input',e=>{ S.hour=parseFloat(e.target.value); setPlaying(false); setHud(); if(S.scope==='hour'||S.event>=0) renderCard(); });

function applyTheme(p){ const dark=p.night>.5;
  root.setProperty('--sky-low',p.low); root.setProperty('--ink',dark?'#F7F4EC':'#14182A'); root.setProperty('--ink-soft',dark?'#CFD3E6':'#3F4A62'); root.setProperty('--ink-on',dark?'#14182A':'#F7F4EC');
  root.setProperty('--glass',dark?'rgba(14,18,40,.6)':'rgba(255,255,255,.68)'); root.setProperty('--glass-line',dark?'rgba(255,255,255,.14)':'rgba(20,30,60,.12)');
  root.setProperty('--from',dark?'#62D2F5':'#2F8FD8'); root.setProperty('--to',dark?'#FFC15E':'#F08A24'); root.setProperty('--track',dark?'rgba(255,255,255,.18)':'rgba(20,30,60,.12)');
  root.setProperty('--glow',dark?'rgba(0,0,0,.35)':'rgba(255,255,255,.75)'); }

function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); composer.setSize(w,h); bloom.setSize(w*.5,h*.5); camera.aspect=w/h; camera.updateProjectionMatrix();
  if(!resize.done){ const portrait=h>w; camera.position.copy(controls.target).add(new THREE.Vector3().setFromSpherical(new THREE.Spherical(portrait?118:72,portrait?.86:.8,0))); resize.done=true; }
  root.setProperty('--dock-h',$('dock').offsetHeight+'px'); }
addEventListener('resize',resize); resize();

// ---------- 迴圈 ----------
const clk=new THREE.Clock(); let t=0; const v3=new THREE.Vector3(); let lastHourInt=-1;
function frame(){
  const dt=Math.min(.05,clk.getDelta()); t+=dt;
  if(S.playing){ S.hour=(S.hour+dt/(reduce?3.4:1.8))%24; setHud(); const hi=Math.floor(S.hour); if(hi!==lastHourInt){ lastHourInt=hi; if(S.scope==='hour'||S.event>=0) renderCard(); } }
  const p=palAt(S.hour); applyTheme(p); const night=p.night;
  skyU.top.value.set(p.top); skyU.low.value.set(p.low); scene.fog.color.set(p.low);
  groundMat.color.set(p.ground); sideMat.color.copy(groundMat.color).multiplyScalar(.62); riverMat.color.set(p.river); hillMat.color.set(p.hill);
  bMat.color.set(lerpHex('#F4EFE4','#343C5E',night));
  const dayT=(S.hour-6)/12, isDay=dayT>0&&dayT<1, el=isDay?Math.sin(Math.PI*dayT):.35, az=isDay?Math.PI*(1-dayT):Math.PI*.3;
  sun.position.set(Math.cos(az)*Math.cos(el*1.1)*60,Math.max(.15,Math.sin(el*1.1))*60,-21); sun.intensity=isDay?.6+2.2*el:.35;
  sun.color.set(isDay?lerpHex('#ffb37a','#fff6e6',Math.min(1,el*1.6)):'#9fb4ff'); hemi.intensity=.35+.95*(1-night); hemi.color.set(p.top); hemi.groundColor.set(p.ground);
  bloom.strength=.35+.9*night;
  cFrom.set(night>.5?'#62D2F5':'#2F8FD8'); cTo.set(night>.5?'#FFC15E':'#F08A24');

  // 目標流向
  const fm=flowMapAt(S.hour); const e=S.event>=0?EV[S.event]:null;
  let list=[...fm.entries()].filter(([k])=>Math.floor(k/100)!==k%100);
  if(S.sel>=0) list=list.filter(([k])=> S.dir==='out' ? Math.floor(k/100)===S.sel : k%100===S.sel);
  list.sort((a,b)=>b[1]-a[1]); list=list.slice(0,S.sel>=0?14:46);
  const want=new Set(list.map(([k])=>k));
  for(const [k,n] of list){ const o=Math.floor(k/100), d=k%100; arcFor(k,DC[o],DC[d]).tgt=n; }
  // 事件：從各區飛向事件車站
  if(e && S.sel<0){ const h=Math.floor(S.hour)%24; for(const [o,n] of (e.arrive[h]||[]).slice(0,12)){ const k=10000+o; want.add(k); arcFor(k,DC[o],SP[e.stIdx]).tgt=n*1.0; } }
  const k2=reduce?1:Math.min(1,dt*3.2); let pi=0;
  for(const [k,f] of arcs){ if(!want.has(k)) f.tgt=0; f.cur+=(f.tgt-f.cur)*k2;
    const toEvent=k>=10000; const op=Math.min(.85,f.cur/1800)*(toEvent?1.2:1);
    f.line.material.opacity=op; const col=f.line.geometry.attributes.color;
    for(let i=0;i<col.count;i++){ tmpC.copy(cFrom).lerp(cTo,i/(col.count-1)); col.setXYZ(i,tmpC.r,tmpC.g,tmpC.b); } col.needsUpdate=true;
    if(f.cur<2 && f.tgt===0){ scene.remove(f.line); f.line.geometry.dispose(); arcs.delete(k); continue; }
    const cnt=Math.min(toEvent?60:44, Math.floor(f.cur/PER)); const spd=reduce?0:.22;
    for(let j=0;j<cnt && pi<MAXP;j++,pi++){ const u=((j*.6180339+f.seed)+t*spd)%1; f.curve.getPoint(u,ps); const s=.8+.5*Math.sin(Math.PI*u); sc.set(s,s,s); m4.compose(ps,q.identity(),sc); parts.setMatrixAt(pi,m4);
      tmpC.copy(cFrom).lerp(cTo,u).multiplyScalar(1.25+night*.6); parts.setColorAt(pi,tmpC); } }
  parts.count=pi; parts.instanceMatrix.needsUpdate=true; if(parts.instanceColor) parts.instanceColor.needsUpdate=true;
  // 行政區光圈：出發量
  const outSum=new Float32Array(ND); for(const [k,n] of fm) if(Math.floor(k/100)!==k%100) outSum[Math.floor(k/100)]+=n;
  pads.forEach((m,i)=>{ const v=Math.sqrt(outSum[i]/9000); const s=2+v*7; m.position.set(DC[i].x,.05+i*.001,DC[i].z); m.scale.set(s,1,s); m.material.color.copy(cFrom); m.material.opacity=Math.min(.9,.15+v*.6)*(S.sel<0||S.sel===i?1:.25); });
  // 事件脈衝
  pulse.forEach((m,j)=>{ if(!e){ m.material.opacity=0; return; } const ph=((t*.5)+j/3)%1; const s=.5+ph*6; m.position.copy(SP[e.stIdx]).setY(.12); m.scale.set(s,1,s); m.material.opacity=(1-ph)*.9; m.material.color.copy(cTo); });
  controls.update(); composer.render();
  // 標籤
  const r=canvas.getBoundingClientRect();
  tags.forEach((b,i)=>{ v3.copy(DC[i]).setY(.6).project(camera); b.style.left=((v3.x+1)/2*r.width)+'px'; b.style.top=((1-v3.y)/2*r.height)+'px'; });
  if(e){ evTag.hidden=false; evTag.textContent=e.st+'　'+(e.verified?e.label:'待確認'); v3.copy(SP[e.stIdx]).setY(3).project(camera); evTag.style.left=((v3.x+1)/2*r.width)+'px'; evTag.style.top=((1-v3.y)/2*r.height)+'px'; } else evTag.hidden=true;
  requestAnimationFrame(frame);
}
setHud(); refreshPressed(); $('boot').hidden=true; requestAnimationFrame(frame);
</script>
