<title>城市呼吸 微縮城市</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 一個畫面的 app：3D 微縮城市鋪滿，時鐘 HUD 在上，玻璃控制列在下。顏色隨時間由 JS 改寫 token。 */
:root{
  --sky-top:#BFE0F6; --sky-low:#EAF4F7;
  --ink:#14182A; --ink-soft:#3F4A62; --ink-on:#F7F4EC;
  --glass:rgba(255,255,255,.62); --glass-line:rgba(20,30,60,.12);
  --energy:#F2A33A; --track:rgba(20,30,60,.14);
  --font-num:"Geist",ui-sans-serif,system-ui,sans-serif;
  --font-text:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;overflow:hidden;background:linear-gradient(180deg,var(--sky-top),var(--sky-low) 55%);color:var(--ink);font-family:var(--font-text);-webkit-tap-highlight-color:transparent}
#scene{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;left:0;right:0;top:calc(14px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.clock{font-family:var(--font-num);font-weight:600;font-size:clamp(48px,11vw,72px);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;text-shadow:0 2px 20px var(--clock-glow,rgba(255,255,255,.7))}
.energy{display:flex;align-items:center;gap:8px}
.energy svg{width:12px;height:16px}
.bar{width:min(200px,46vw);height:8px;border-radius:999px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--energy);transform-origin:left;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.phase{font-weight:700;font-size:15px;text-shadow:0 1px 12px var(--clock-glow,rgba(255,255,255,.7))}
.city-n{font-family:var(--font-num);font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.labels{position:fixed;inset:0;pointer-events:none}
.labels span{position:absolute;transform:translate(-50%,-140%);font-size:12px;font-weight:700;color:var(--ink);text-shadow:0 0 6px var(--sky-low),0 0 2px var(--sky-low);white-space:nowrap}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 2*max(16px,env(safe-area-inset-left,0px))));display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:24px;background:var(--glass);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-sizing:border-box}
.row{display:flex;align-items:center;gap:12px}
.play{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--ink);color:var(--ink-on);display:grid;place-items:center;cursor:pointer;transition:transform .12s ease}
.play:active{transform:scale(.94)}
.play svg{width:16px;height:16px}
.story{margin:0;font-size:15px;line-height:1.45;font-weight:500;min-width:0}
.time{position:relative}
.time .track{position:absolute;left:0;right:0;top:10px;height:8px;border-radius:999px}
.time input{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;position:relative}
.time input::-webkit-slider-runnable-track{height:8px;background:transparent}
.time input::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--ink);margin-top:-8px;box-shadow:0 2px 10px rgba(0,0,0,.28)}
.time input::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--ink)}
.ticks{display:flex;justify-content:space-between;font-family:var(--font-num);font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.modes{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -4px;padding:2px 4px}
.modes::-webkit-scrollbar{display:none}
.modes button{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--glass-line);background:transparent;color:var(--ink);font:500 14px/1 var(--font-text);cursor:pointer;transition:background .2s ease,color .2s ease,transform .12s ease}
.modes button:active{transform:scale(.96)}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--ink-on);border-color:var(--ink)}
.hint{font-size:12px;color:var(--ink-soft)}
.card{position:fixed;left:50%;transform:translate(-50%,12px);opacity:0;bottom:calc(var(--dock-h,190px) + 26px + env(safe-area-inset-bottom,0px));width:min(360px,calc(100% - 32px));padding:14px 16px;border-radius:20px;background:var(--glass);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);transition:opacity .2s ease,transform .25s cubic-bezier(.2,.8,.2,1);pointer-events:none;box-sizing:border-box}
.card.open{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.card h2{margin:0;font-size:18px;display:flex;align-items:center;gap:8px;text-wrap:balance}
.dots{display:flex;gap:4px}.dots i{width:10px;height:10px;border-radius:50%}
.card .num{font-family:var(--font-num);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:12px;padding:4px 10px;border-radius:999px;background:var(--track)}
.card p{margin:4px 0 0;font-size:13px;color:var(--ink-soft);line-height:1.5}
.close{position:absolute;right:8px;top:8px;width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:var(--ink);cursor:pointer;font-size:18px}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.boot[hidden]{display:none}
.boot{position:fixed;inset:0;display:grid;place-items:center;font-size:15px;color:var(--ink-soft);pointer-events:none}
@media (prefers-reduced-motion:reduce){.bar>i,.card,.play,.modes button{transition:none}}
</style>

<canvas id="scene" aria-label="台北捷運微縮城市：平日各站人流隨時間變化"></canvas>
<div class="boot" id="boot">載入城市中…</div>
<div class="labels" id="labels" aria-hidden="true"></div>

<header class="hud">
  <div class="clock" id="clock">08:00</div>
  <div class="energy" aria-label="全城這一小時進站人數">
    <svg viewBox="0 0 12 16" aria-hidden="true"><path d="M7 0 L0 9 H5 L4 16 L12 6 H7 Z" fill="var(--energy)"/></svg>
    <div class="bar"><i id="bar"></i></div>
  </div>
  <div class="phase" id="phase">尖峰吸氣</div>
  <div class="city-n" id="cityN"></div>
</header>

<section class="card" id="card" aria-live="polite">
  <button class="close" id="cardClose" type="button" aria-label="關閉車站資訊">×</button>
  <h2><span id="cName">台北車站</span><span class="dots" id="cDots"></span></h2>
  <div class="row" style="gap:10px;align-items:baseline;margin-top:4px">
    <span class="num" id="cNum">0</span><span id="cUnit">人進出</span>
    <span class="chip" id="cChip">吸人</span>
  </div>
  <p id="cNote"></p>
</section>

<section class="dock" id="dock" aria-label="時間與地圖模式">
  <div class="row">
    <button class="play" id="play" type="button" aria-label="播放一整天">
      <svg id="playIcon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1 L15 8 L3 15 Z" fill="currentColor"/></svg>
    </button>
    <p class="story" id="story"></p>
  </div>
  <div class="time">
    <div class="track" id="dayTrack" aria-hidden="true"></div>
    <label for="hour" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">時間</label>
    <input id="hour" type="range" min="0" max="23.99" step="0.01" value="8">
    <div class="ticks" aria-hidden="true"><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></div>
  </div>
  <div class="modes" role="group" aria-label="地圖模式" id="modes">
    <button type="button" data-mode="trains" aria-pressed="true">光點列車</button>
    <button type="button" data-mode="ripples" aria-pressed="false">漣漪</button>
    <button type="button" data-mode="windows" aria-pressed="false">建築亮燈</button>
    <button type="button" data-mode="heat" aria-pressed="false">吸吐熱度</button>
    <button type="button" data-mode="columns" aria-pressed="false">光柱</button>
  </div>
  <div class="hint" id="hint">點車站看人數；拖曳可轉動視角</div>
</section>

  s.lineTo(x+r,y+h); s.quadraticCurveTo(x,y+h,x,y+h-r); s.lineTo(x,y+r); s.quadraticCurveTo(x,y,x+r,y); return s; }

function ribbon(pts, width){ const v=[],idx=[]; const P=pts.map(W);
  for(let i=0;i<P.length;i++){ const a=P[Math.max(0,i-1)], b=P[Math.min(P.length-1,i+1)];
    const d=new THREE.Vector3().subVectors(b,a).normalize(); const n=new THREE.Vector3(-d.z,0,d.x).multiplyScalar(width/2);
    v.push(P[i].x+n.x,0.03,P[i].z+n.z, P[i].x-n.x,0.03,P[i].z-n.z);
    if(i<P.length-1){ const k=i*2; idx.push(k,k+1,k+2,k+1,k+3,k+2); } }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(v,3)); g.setIndex(idx); g.computeVertexNormals(); return g; }

const B_PER = 6; const bCount = N*B_PER;

// 窗戶：三條樓層燈帶，加法混色，黑色時等於不存在
const wGeo = mergeGeometries([.28,.52,.76].map(y=>{ const g=new THREE.BoxGeometry(1.04,.07,1.04); g.translate(0,y,0); return g; }));
const wMat = new THREE.MeshBasicMaterial({color:'#ffffff', toneMapped:false, blending:THREE.AdditiveBlending, transparent:true, depthWrite:false});
const wMesh = new THREE.InstancedMesh(wGeo, wMat, bCount);
const bOwner = new Int16Array(bCount); const bH = new Float32Array(bCount);
const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3(), ps = new THREE.Vector3();
let rnd = 7; const R = () => (rnd = (rnd*16807)%2147483647)/2147483647;
for(let i=0,k=0;i<N;i++){ for(let j=0;j<B_PER;j++,k++){
  const ang=R()*Math.PI*2, dist=0.7+R()*1.6; const x=SP[i].x+Math.cos(ang)*dist, z=SP[i].z+Math.sin(ang)*dist;
  const centrality = Math.max(0, 1 - Math.hypot(SP[i].x-0.5, SP[i].z+0.5)/16);
  const h=0.25+R()*0.9+centrality*R()*2.2, w=0.35+R()*0.35, d=0.35+R()*0.35;
  bOwner[k]=i; bH[k]=h;
  ps.set(x,0,z); q.setFromAxisAngle(new THREE.Vector3(0,1,0), R()*0.6); sc.set(w,h,d); m4.compose(ps,q,sc); bMesh.setMatrixAt(k,m4);
  sc.set(w,h,d); ps.set(x,0,z); m4.compose(ps,q,sc); wMesh.setMatrixAt(k,m4); wMesh.setColorAt(k,new THREE.Color(0,0,0));
}}

function totAt(h){ const a=Math.floor(h)%24, b=(a+1)%24, t=h-Math.floor(h); const A=D.tot[a], B=D.tot[b];

  return {skyTop:lerpHex(A[0],B[0],t), skyLow:lerpHex(A[1],B[1],t), dark:(t<.5?A[2]:B[2]), ground:lerpHex(A[3],B[3],t), river:lerpHex(A[4],B[4],t), hill:lerpHex(A[5],B[5],t), night:(A[2]+(B[2]-A[2])*t)}; }

  else { $('cNum').textContent=fmt(T[i]); $('cUnit').textContent='人進出'; $('cChip').hidden=!D.recorded[i];
    $('cChip').textContent = D.inflow[hi][i]==='1' ? '吸人：出站比較多' : '吐人：進站比較多'; }
  $('cNote').textContent = (D.recorded[i] ? '' : '環狀線出站人次未公開，只計進站。') + '平日 '+String(hi).padStart(2,'0')+':00 那一小時的平均（2026 年 9 月）。'; }

let down=null;
canvas.addEventListener('pointerdown', e=>{ down={x:e.clientX,y:e.clientY}; });
canvas.addEventListener('pointerup', e=>{ if(!down) return; const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y); down=null; if(moved>6) return;
  const r=canvas.getBoundingClientRect(); let best=-1, bd=28; const v=new THREE.Vector3();
  for(let i=0;i<N;i++){ v.copy(SP[i]).setY(.4).project(camera); const sx=(v.x+1)/2*r.width, sy=(1-v.y)/2*r.height; const d=Math.hypot(sx-(e.clientX-r.left), sy-(e.clientY-r.top)); if(d<bd){bd=d;best=i;} }
  best>=0 ? openCard(best) : closeCard(); });

  for(const x of $('modes').children) x.setAttribute('aria-pressed', String(x===b)); });

// 地標標籤
const LABELS = [[36,'台北車站'],[54,'市政府'],[0,'板橋'],[92,'淡水'],[22,'動物園'],[70,'新店']];
const labelEls = LABELS.map(([i,t])=>{ const s=document.createElement('span'); s.textContent=t; $('labels').appendChild(s); return s; });

// ---------- 版面 ----------
function resize(){ const w=innerWidth, h=innerHeight; renderer.setSize(w,h,false); composer.setSize(w,h); bloom.setSize(w*.5,h*.5);
  camera.aspect=w/h; camera.updateProjectionMatrix(); const portrait=h>w;
  const dist = portrait ? 122 : 74; const sph=new THREE.Spherical(dist, portrait?0.88:0.82, 0); const off=new THREE.Vector3().setFromSpherical(sph);
  if(!resize.done){ camera.position.copy(controls.target).add(off); resize.done=true; }
  root.setProperty('--dock-h', $('dock').offsetHeight+'px'); }
addEventListener('resize', resize); resize();

// ---------- 迴圈 ----------
const clock3 = new THREE.Clock(); let t0=0;
const sunDir = new THREE.Vector3();
function frame(){
  const dt=Math.min(.05, clock3.getDelta()); t0+=dt;
  if(playing){ hour=(hour+dt/(reduce?3.2:1.6))%24; setHud(); }
  const p=palAt(hour); applyTheme(p);
  scene.fog.color.set(p.skyLow); skyU.top.value.set(p.skyTop); skyU.low.value.set(p.skyLow); groundMat.color.set(p.ground); riverMat.color.set(p.river); hillMat.color.set(p.hill);
  sideMat.color.copy(groundMat.color).multiplyScalar(.62);
  // 太陽：6 點東升、18 點西落；夜裡換成月光
  const dayT=(hour-6)/12, isDay=dayT>0&&dayT<1; const el=isDay?Math.sin(Math.PI*dayT):.35;
  const az=isDay?Math.PI*(1-dayT):Math.PI*.3;
  sunDir.set(Math.cos(az)*Math.cos(el*1.1), Math.max(.15,Math.sin(el*1.1)), -.35).normalize();
  sun.position.copy(sunDir).multiplyScalar(60); sun.target.position.set(0,0,0);
  const night=p.night; sun.intensity = isDay ? 0.6+2.2*el : 0.35;
  sun.color.set(isDay ? lerpHex('#ffb37a','#fff6e6',Math.min(1,el*1.6)) : '#9fb4ff');
  hemi.intensity = 0.35+0.95*(1-night); hemi.color.set(p.skyTop); hemi.groundColor.set(p.ground);
  bloom.strength = 0.28+0.95*night; renderer.toneMappingExposure = 1.0-0.1*night;
  for(const m of Object.values(railMats)) m.emissiveIntensity = .9+2.0*night;
  bMat.color.set(lerpHex('#F4EFE4','#343C5E',night)); glass.emissiveIntensity = .2+1.6*night;
  cloudMat.opacity = .45*(1-night)+.08;
  clouds.forEach((c,k)=>{ c.position.x += Math.sin(t0*.05+k)*0.004; });

  // 資料：平滑追上目標值
  const fT=totAt(hour), fI=inflowAt(hour); const k=reduce?1:Math.min(1,dt*4);
  for(let i=0;i<N;i++){ tgt[i]=Math.sqrt(fT(i)/MAXT); cur[i]+= (tgt[i]-cur[i])*k; inflowCur[i]+= (fI(i)-inflowCur[i])*k; }

  const show = n => n===mode;
  // 列車
  for(const [key,tr] of Object.entries(trains)){ tr.mesh.visible=show('trains'); if(!tr.mesh.visible) continue;
    const seq=D.lines[key]; let avg=0; for(const i of seq) avg+=cur[i]; avg/=seq.length;
    const n=Math.round(tr.max*Math.min(1,avg*1.7)); tr.mesh.count=n; const c=curves[key]; const speed=reduce?0:.018;
    for(let j=0;j<n;j++){ let u=(tr.seed[j]+t0*speed*tr.dir[j])%1; if(u<0)u+=1; c.getPointAt(u,ps); const tan=c.getTangentAt(u);
      ps.x+=-tan.z*tr.lane[j]; ps.z+=tan.x*tr.lane[j]; ps.y=.34; const s=.8+avg*.9; sc.set(s,s,s); m4.compose(ps,q.identity(),sc); tr.mesh.setMatrixAt(j,m4); }
    tr.mesh.instanceMatrix.needsUpdate=true; }
  // 漣漪
  rippleGroup.visible=show('ripples');
  if(rippleGroup.visible){ for(const r of ripples){ const v=cur[r.i]; const spd=reduce?0:(.35+v*.9); const ph=(r.phase+t0*spd)%1;
    const s=.3+ph*(.8+v*4.2); r.m.scale.set(s,1,s); r.m.material.opacity = v<.03?0:(1-ph)*(.25+v*.9); } }
  // 建築亮燈
  const winOn = show('windows');
  for(let b=0;b<bCount;b++){ const v=cur[bOwner[b]]; const lit = winOn ? v*v*2.6*(0.5+0.5*night) : night*.55*(0.4+v);
    tmpC.setRGB(1.0*lit,.78*lit,.42*lit); wMesh.setColorAt(b,tmpC); }
  wMesh.instanceColor.needsUpdate=true;
  // 熱度
  heat.visible=show('heat');
  if(heat.visible){ for(let i=0;i<N;i++){ const v=cur[i]; const s=.4+v*7.5; ps.set(SP[i].x,.06+i*.0004,SP[i].z); sc.set(s,1,s); m4.compose(ps,q.identity(),sc); heat.setMatrixAt(i,m4);
      const warm=inflowCur[i]; tmpC.setRGB((.25+.95*warm)*v*1.6, (.55-.1*warm)*v*1.4, (1.1-.85*warm)*v*1.6); heat.setColorAt(i,tmpC); }
    heat.instanceMatrix.needsUpdate=true; heat.instanceColor.needsUpdate=true; }
  // 光柱
  cols.visible=show('columns');
  if(cols.visible){ for(let i=0;i<N;i++){ const hgt=.05+cur[i]*9; ps.set(SP[i].x,.36,SP[i].z); sc.set(1,hgt,1); m4.compose(ps,q.identity(),sc); cols.setMatrixAt(i,m4); } cols.instanceMatrix.needsUpdate=true; }
  // 選中的站：底座放大
  for(let i=0;i<N;i++){ const s=i===selected?1.9:1; ps.set(SP[i].x,.36,SP[i].z); sc.set(s,1,s); m4.compose(ps,q.identity(),sc); pads.setMatrixAt(i,m4); }
  pads.instanceMatrix.needsUpdate=true;

  controls.update(); composer.render();
  // 標籤
  const r=canvas.getBoundingClientRect(); const v3=new THREE.Vector3();
  LABELS.forEach(([i],j)=>{ v3.copy(SP[i]).setY(1.2).project(camera); labelEls[j].style.left=((v3.x+1)/2*r.width)+'px'; labelEls[j].style.top=((1-v3.y)/2*r.height)+'px'; });
  requestAnimationFrame(frame);
}
setHud(); for(let i=0;i<N;i++){ cur[i]=Math.sqrt(totAt(hour)(i)/MAXT); inflowCur[i]=inflowAt(hour)(i); }
$('boot').hidden=true; requestAnimationFrame(frame);
</script>
