<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>城市呼吸 2.1 微縮城市 第四輪</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 2.1 原型第四輪：天光定案。台北盆地真實地形、有故事的地標、城市徽章、大日子、此刻最忙。
   所有顏色只在這裡以 token 定義，JS 與 shader 由 getComputedStyle 讀取（AD-8）。
   日夜：token 名稱後綴 -night／-dawn／-day／-dusk，JS 依時刻在相鄰兩組之間內插；沒有後綴的 token 全天共用。 */
:root {
  --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --radius: 14px;
  /* 捷運路線色：臺北捷運路線資料服務（data.taipei）的 LineColor 欄位 */
  --line-br: #b57a25;
  --line-r: #d90023;
  --line-r3: #ef9298;
  --line-g: #107547;
  --line-g3: #d2de1a;
  --line-o: #f5a818;
  --line-bl: #0a59ae;
  /* 環狀線由新北捷運營運，不在臺北捷運的路線資料裡；先用黃色，正式版查新北捷運的官方色碼 */
  --line-y: #f2c500;
  --flow-neutral: #e9781e;
  --flow-in: #e2582b;
  --flow-out: #2a7fd0;
  --commute: #d63a48;
  --ripple: #ffd9a0;
  --particle-hi: #fffaf0;
  --shadow: #1c160c;
  /* 建築與樹的色調：乘在材質色上，讓同一區有三種牆色、兩種樹色 */
  --bld-tint-1: #ffffff; --bld-tint-2: #f1e8dc; --bld-tint-3: #e1e8ee;
  --accent-1: #e39a80; --accent-2: #9fc2b4; --accent-3: #e9c98a;
  --tree-tint-1: #ffffff; --tree-tint-2: #dcebc9;
  /* 地標（示意）：台北 101、圓山大飯店、中正紀念堂 */
  --lm-glass: #8db1c2; --lm-red: #b9483b; --lm-gold: #e2b24c; --lm-white: #f5f1e8; --lm-blue: #2e5d9b;
  --cloud: #ffffff;
  --train-glow: #fff4d6;
  --gem: #ffc83d; --gem-light: #fff1b8; --gem-ink: #b07a00; --gem-found: #4fc9b8; --gem-glow: #ffe08a; --unlock-bg: rgba(255, 200, 61, 0.14);
  --lm-roof-dark: #4d4440; --runway: #6f737c; --lantern: #ff8a3d; --steam: #ffffff; --elephant: #a7b0ba; --beam: #fff1b0;
  --boat: #ffffff; --boat-sail: #e8604c; --cable: #4f545c; --gondola: #e9573f;
  --star: #ffffff;
  --sun-disc: #fff3cf;
  --sun-glow: rgba(255, 205, 120, 0.55);
  --moon-disc: #e9edff;
  --moon-glow: rgba(190, 205, 255, 0.35);
  /* HUD：白天亮玻璃、夜晚暗玻璃（data-phase 由 JS 依太陽高度切換） */
  --hud-bg: rgba(255, 252, 246, 0.86);
  --hud-ink: #1b2033;
  --hud-muted: #586079;
  --hud-line: rgba(27, 32, 51, 0.12);
  --hud-accent: #2a7fd0;
  --hud-chip: rgba(27, 32, 51, 0.07);
  --hud-on: #ffffff;
}
:root[data-phase="night"] {
  --hud-bg: rgba(14, 18, 38, 0.80);
  --hud-ink: #eef1ff;
  --hud-muted: #a3acd0;
  --hud-line: rgba(255, 255, 255, 0.14);
  --hud-accent: #7fb6ff;
  --hud-chip: rgba(255, 255, 255, 0.08);
  --hud-on: #0e1226;
}

/* A 天光：材質固定，日夜全靠光——太陽東升西落、陰影跟著轉，夜裡月光、窗光、站燈 */
:root[data-variant="a"] {
  --sky-top-night: #0a0f26;  --sky-horizon-night: #1e2a50;
  --sky-top-dawn: #3a4c8c;   --sky-horizon-dawn: #f7b48f;
  --sky-top-day: #5aa6e0;    --sky-horizon-day: #d9eeff;
  --sky-top-dusk: #35306f;   --sky-horizon-dusk: #f2895a;
  --light-night: #7b8ce0; --light-dawn: #ffb27a; --light-day: #fff2dc; --light-dusk: #ff8f52;
  --amb-sky-night: #2a3466; --amb-sky-dawn: #b9b6dc; --amb-sky-day: #d3e8ff; --amb-sky-dusk: #bba6d0;
  --amb-ground-night: #12141f; --amb-ground-dawn: #7a6a66; --amb-ground-day: #b5a58c; --amb-ground-dusk: #76605e;
  --plinth: #d8c9ac; --plinth-side: #a48d6b; --plinth-line: #b5a382;
  --tile: #f3ede1; --tile-side: #d6c9b2;
  --water: #7db3dc; --green: #a8cf8c;
  --building: #ffffff; --roof: #ebe4d6; --window: #ffcb72;
  --station: #fbf7ef; --station-glow: #ffe0a0;
  --terrain-1: #dfe2b8; --terrain-2: #c6d49c; --terrain-3: #aac485; --terrain-4: #8fb271; --terrain-5: #789f5f; --terrain-6: #648b50; --terrain-side: #a69a74;
  --tree: #93bf74; --strata-1: #b39a74; --strata-2: #8c7457;
}

/* B 調色：每個時段一組配色＋畫面調色（lift/gain）＋三階卡通光，夜裡窗光與流向發光 */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--sky-horizon-day); }
body { font-family: var(--font); color: var(--hud-ink); -webkit-font-smoothing: antialiased; }
#stage { position: fixed; inset: 0; }
.app { position: absolute; inset: 0; }
.app canvas.scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.num { font-variant-numeric: tabular-nums; }

/* 天空：畫在場景後面，顏色由 JS 依時刻寫入 */
.sky { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.sky .stars { position: absolute; inset: 0; }
.sky .stars i { position: absolute; width: 2px; height: 2px; border-radius: 999px; background: var(--star); }
.sky .sun, .sky .moon { position: absolute; left: 0; top: 0; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 999px; }
.sky .sun { background: var(--sun-disc); box-shadow: 0 0 0 10px var(--sun-glow), 0 0 60px 30px var(--sun-glow); }
.sky .moon { width: 26px; height: 26px; margin: -13px 0 0 -13px; background: var(--moon-disc); box-shadow: 0 0 30px 12px var(--moon-glow); }

.hud { position: absolute; color: var(--hud-ink); background: var(--hud-bg);
  -webkit-backdrop-filter: blur(14px) saturate(1.3); backdrop-filter: blur(14px) saturate(1.3);
  border: 1px solid var(--hud-line); border-radius: var(--radius);
  transition: background-color 600ms ease, color 600ms ease, border-color 600ms ease; }
@media (prefers-reduced-motion: reduce) { .hud { transition: none; } }
.hud button, .hud select { font: inherit; color: inherit; }
.hud button:focus-visible, .hud select:focus-visible, .hud input:focus-visible { outline: 2px solid var(--hud-accent); outline-offset: 2px; }

.loading { position: absolute; inset: 0; display: grid; place-items: center; margin: 0; font-size: 14px; color: var(--hud-muted); pointer-events: none; }

/* 上方：找你的通勤＋圖層 */
.commute-pill { top: calc(env(safe-area-inset-top, 0px) + 12px); left: 12px;
  display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 999px; cursor: pointer; font-size: 14px; font-weight: 500; }
.commute-pill svg, .layer-btn svg { width: 16px; height: 16px; }
.layer-btn { top: calc(env(safe-area-inset-top, 0px) + 12px); right: 12px; width: 40px; height: 40px; border-radius: 999px; display: grid; place-items: center; cursor: pointer; padding: 0; }
.layer-btn[aria-expanded="true"] { border-color: var(--hud-accent); }
.layer-panel { top: calc(env(safe-area-inset-top, 0px) + 60px); right: 12px; width: min(260px, calc(100vw - 24px)); padding: 10px; display: grid; gap: 2px; }
.layer-panel h2 { margin: 2px 6px 6px; font-size: 13px; font-weight: 700; }
.layer-panel label { display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 10px; min-height: 40px; padding: 0 6px; border-radius: 10px; cursor: pointer; font-size: 14px; }
.layer-panel label:active { background: var(--hud-chip); }
.layer-panel .sw { width: 18px; height: 18px; border-radius: 6px; }
.layer-panel .sw.rail { background: linear-gradient(135deg, var(--line-r) 0 25%, var(--line-bl) 25% 50%, var(--line-g) 50% 75%, var(--line-o) 75%); }
.layer-panel .sw.flow { background: var(--flow-neutral); }
.layer-panel .sw.station { background: var(--line-r); border-radius: 999px; transform: scale(0.6); box-shadow: 0 0 0 3px var(--hud-chip); }
.layer-panel .sw.water { background: var(--water, var(--water-day)); }
.layer-panel .sw.green { background: var(--green, var(--green-day)); }
.layer-panel .sw.building { background: var(--roof, var(--roof-day)); border: 1px solid var(--hud-line); }
.layer-panel .sw.train { background: var(--line-bl); border-radius: 999px; transform: scaleY(0.45); }
.layer-panel .sw.cloud { background: var(--hud-chip); border: 1px solid var(--hud-line); border-radius: 999px; }
.layer-panel .sw.sound { background: var(--gem); border-radius: 999px; transform: scale(0.7); }
.layer-panel .sw.label { background: none; border: 1px solid var(--hud-muted); font-size: 10px; display: grid; place-items: center; color: var(--hud-muted); }
.layer-panel small { color: var(--hud-muted); font-size: 11px; }
.layer-panel input { appearance: none; -webkit-appearance: none; width: 36px; height: 22px; border-radius: 999px; background: var(--hud-chip); border: 1px solid var(--hud-line); position: relative; margin: 0; cursor: pointer; }
.layer-panel input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 999px; background: var(--hud-muted); transition: transform 160ms ease, background-color 160ms ease; }
.layer-panel input:checked { background: var(--hud-accent); border-color: transparent; }
.layer-panel input:checked::after { transform: translateX(14px); background: var(--hud-on); }
@media (prefers-reduced-motion: reduce) { .layer-panel input::after { transition: none; } }
.layer-panel .src { margin: 6px 6px 2px; font-size: 11px; line-height: 1.5; color: var(--hud-muted); }

.commute-panel { top: calc(env(safe-area-inset-top, 0px) + 60px); left: 12px;
  width: min(420px, calc(100vw - 32px)); padding: 14px; display: grid; gap: 10px; }
.commute-panel h2 { margin: 0; font-size: 15px; }
.commute-panel label { display: grid; gap: 4px; font-size: 12px; color: var(--hud-muted); }
.commute-panel select { height: 38px; border-radius: 10px; border: 1px solid var(--hud-line); background: var(--hud-chip); padding: 0 8px; font-size: 14px; color: var(--hud-ink); }
.commute-panel .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.commute-panel .actions { display: flex; gap: 8px; justify-content: flex-end; }

.btn { height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--hud-line); background: var(--hud-chip); cursor: pointer; font-size: 13px; }
.btn.primary { background: var(--hud-accent); border-color: transparent; color: var(--hud-on); font-weight: 700; }
.btn:active, .layer-btn:active, .commute-pill:active { transform: scale(0.97); }
.commute-pill:active { transform: scale(0.97); }

/* 下方：時間軸＋圖例 */
.dock { left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); max-width: 640px; margin: 0 auto;
  padding: 10px 12px; display: grid; gap: 8px; }
.dock .top { display: flex; align-items: center; gap: 10px; }
.play { width: 40px; height: 40px; border-radius: 999px; border: 0; background: var(--hud-accent); color: var(--hud-on); display: grid; place-items: center; cursor: pointer; flex: none; }
.play svg { width: 16px; height: 16px; }
.clock { display: grid; gap: 1px; min-width: 0; flex: 1; }
.clock .time { font-size: 22px; font-weight: 700; line-height: 1; letter-spacing: 0.01em; display: flex; align-items: center; gap: 8px; }
.clock .orb { width: 14px; height: 14px; border-radius: 999px; flex: none; }
.clock .orb.sun { background: var(--sun-disc); box-shadow: 0 0 0 3px var(--sun-glow); }
.clock .orb.moon { background: transparent; box-shadow: inset -4px 2px 0 0 var(--moon-disc); }
.clock .phase { font-size: 12px; color: var(--hud-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg { display: flex; padding: 2px; border-radius: 10px; background: var(--hud-chip); flex: none; }
.seg button { height: 30px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; cursor: pointer; font-size: 12px; color: var(--hud-muted); }
.seg button[aria-pressed="true"] { background: var(--hud-bg); color: var(--hud-ink); font-weight: 700; }
.dock .bottom { display: flex; align-items: center; gap: 10px; }
.scrub { flex: 1; height: 22px; margin: 0; border-radius: 999px; -webkit-appearance: none; appearance: none; border: 1px solid var(--hud-line); cursor: pointer; }
.scrub::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 999px; background: var(--hud-bg); border: 2px solid var(--hud-ink); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25); }
.scrub::-moz-range-thumb { width: 18px; height: 18px; border-radius: 999px; background: var(--hud-bg); border: 2px solid var(--hud-ink); }
.mini { height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--hud-line); background: transparent; cursor: pointer; font-size: 12px; color: var(--hud-muted); flex: none; }
.mini[aria-pressed="true"] { color: var(--hud-ink); border-color: var(--hud-accent); }
.legend { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 11px; color: var(--hud-muted); line-height: 1; min-height: 16px; }
.legend .bar { display: inline-block; width: 22px; border-radius: 999px; background: var(--flow-neutral); vertical-align: middle; }
.legend .item { display: inline-flex; align-items: center; gap: 4px; }
.legend .dotk { width: 6px; height: 6px; border-radius: 999px; background: var(--flow-neutral); box-shadow: 0 0 0 2px var(--hud-chip); }
.legend .sep { width: 1px; height: 10px; background: var(--hud-line); }

/* 下方：行政區小卡、流向小卡、通勤結果（取代時間軸位置） */
.sheet { left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); max-width: 640px; margin: 0 auto;
  max-height: 34vh; overflow: auto; padding: 12px 14px 14px; display: grid; gap: 10px; }
.sheet header { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; }
.sheet header .sub { order: 3; flex-basis: 100%; }
.sheet h2 { margin: 0; font-size: 18px; }
.sheet .sub { font-size: 12px; color: var(--hud-muted); }
.sheet .close { margin-left: auto; width: 32px; height: 32px; border-radius: 999px; border: 1px solid var(--hud-line); background: transparent; cursor: pointer; display: grid; place-items: center; flex: none; }
.sheet .close svg { width: 14px; height: 14px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.cols h3 { margin: 0 0 6px; font-size: 12px; font-weight: 500; color: var(--hud-muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 999px; display: inline-block; }
.rank { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.rank button { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; text-align: left; padding: 6px 8px; border-radius: 8px; border: 0; background: var(--hud-chip); cursor: pointer; }
.rank .n { font-size: 14px; font-weight: 500; }
.rank .v { font-size: 13px; }
.rank .s { grid-column: 1 / -1; height: 3px; border-radius: 999px; background: var(--hud-line); overflow: hidden; }
.rank .s i { display: block; height: 100%; }
.note { margin: 0; font-size: 11px; color: var(--hud-muted); line-height: 1.5; }
.big { display: flex; align-items: baseline; gap: 8px; }
.big b { font-size: 40px; line-height: 1; }
.big span { font-size: 14px; }

/* 車站小卡 */
.lchips { display: flex; gap: 4px 10px; flex-wrap: wrap; order: 4; flex-basis: 100%; }
.lchip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--hud-muted); }
.lchip i { width: 10px; height: 4px; border-radius: 999px; }
.stat3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.stat3 div { background: var(--hud-chip); border-radius: 10px; padding: 6px 8px; display: grid; gap: 2px; }
.stat3 b { font-size: 17px; line-height: 1.1; }
.stat3 span { font-size: 11px; color: var(--hud-muted); }
.spark { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; align-items: end; height: 38px; }
.spark button { height: 100%; padding: 0; border: 0; background: transparent; display: flex; align-items: flex-end; cursor: pointer; }
.spark button i { display: block; width: 100%; min-height: 2px; border-radius: 2px 2px 0 0; background: var(--hud-line); }
.spark button[aria-current="true"] i { background: var(--hud-accent); }
.spark-axis { display: flex; justify-content: space-between; font-size: 10px; color: var(--hud-muted); margin-top: -6px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--hud-line); background: var(--hud-chip); cursor: pointer; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; }
.chips button i { width: 6px; height: 6px; border-radius: 999px; }
.sheet h3.sec { margin: 0; font-size: 12px; font-weight: 500; color: var(--hud-muted); }

/* 右上：徽章；左上第二排：此刻最忙 */
.medal-btn { top: calc(env(safe-area-inset-top, 0px) + 12px); right: 60px; height: 40px; padding: 0 12px 0 10px; border-radius: 999px; display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 13px; }
.medal-btn svg, .top-chip svg { width: 18px; height: 18px; color: var(--gem-ink); flex: none; }
.top-chip { top: calc(env(safe-area-inset-top, 0px) + 60px); left: 12px; height: 34px; padding: 0 12px 0 10px; border-radius: 999px; display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 12px; max-width: calc(100vw - 24px); white-space: nowrap; }
.top-chip span { color: var(--hud-muted); }
.medal-btn:active, .top-chip:active { transform: scale(0.96); }
.unlock { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--unlock-bg); border: 1px solid var(--gem); }
.unlock b { display: block; font-size: 14px; }
.unlock span { font-size: 12px; color: var(--hud-muted); }
.unlock.new { animation: unlock-pop 650ms cubic-bezier(0.2, 1.6, 0.4, 1); }
@keyframes unlock-pop { from { transform: scale(0.8); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .unlock.new { animation: none; } }
.medal { width: 26px; height: 26px; border-radius: 999px; flex: none; background: var(--hud-chip); border: 2px dashed var(--hud-muted); }
.medal.on { background: radial-gradient(circle at 35% 30%, var(--gem-light), var(--gem)); border: 2px solid var(--gem-ink); }
.blist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.blist li > * { width: 100%; display: flex; gap: 10px; align-items: center; text-align: left; padding: 8px 10px; border-radius: 10px; background: var(--hud-chip); border: 0; font: inherit; color: inherit; }
.blist button { cursor: pointer; }
.blist span { font-size: 12px; color: var(--hud-muted); line-height: 1.45; }
.blist b { display: block; font-size: 14px; color: var(--hud-ink); }
.story { margin: 0; font-size: 15px; line-height: 1.6; }
.rank .s2 { grid-column: 1 / -1; font-size: 11px; color: var(--hud-muted); }
.sheet a { color: var(--hud-accent); }

/* 時段切換的提示 */
.toast { top: calc(env(safe-area-inset-top, 0px) + 108px); left: 50%; transform: translateX(-50%); padding: 8px 14px; border-radius: 999px;
  font-size: 13px; font-weight: 700; display: flex; gap: 8px; align-items: center; pointer-events: none; white-space: nowrap; }
.toast small { font-weight: 400; color: var(--hud-muted); }

/* 場景上的文字：選中區名牌、前三大流向數字、區名、站名 */
.slabel { position: absolute; left: 0; top: 0; pointer-events: none; white-space: nowrap; display: flex; align-items: center; gap: 4px;
  padding: 2px 7px 2px 5px; border-radius: 999px; background: var(--hud-bg); border: 1px solid var(--hud-line); color: var(--hud-ink); font-size: 10.5px; font-weight: 500; }
.slabel i { width: 6px; height: 6px; border-radius: 999px; }
.slabel.on { font-size: 12px; font-weight: 700; border-color: var(--hud-accent); }
.badge, .flabel, .dlabel { position: absolute; left: 0; top: 0; pointer-events: none; white-space: nowrap; }

// ───────────────────────── 資料 ─────────────────────────
// 原型直接讀網站的資料契約（AD-1）；疊圖（捷運路線、河川、綠地、班距）是原型自帶的 layers.json，由 tools/build_layers.py 產生，正式版改由管線輸出。
const MONTH = '2026-09';
const BASE = location.pathname.includes('/design/prototypes/')
  ? new URL(`../../../web/public/data/${MONTH}/`, location.href)
  : new URL(`data/${MONTH}/`, location.href);
const LAYERS_URL = new URL('layers.json', location.href);
let DATA = null;

async function loadData() {
  if (DATA) return DATA;
  const get = (u) => fetch(u).then((r) => { if (!r.ok) throw new Error(String(u).split('/').pop()); return r.json(); });
  const [districts, flows, stations, layers] = await Promise.all([
    get(new URL('districts.json', BASE)), get(new URL('district-flows.json', BASE)), get(new URL('stations.json', BASE)),
    get(LAYERS_URL).catch(() => null),
  ]);
  const events = await get(new URL('events.json', BASE)).catch(() => null);
  const byId = new Map(districts.districts.map((d) => [d.id, d]));
  const D = flows.districts.map((id, i) => ({ i, id, ...byId.get(id) }));
  const dIndex = new Map(D.map((d) => [d.id, d.i]));
  const S = stations.stations.map((s, i) => ({ i, ...s, di: dIndex.get(s.district), lines: layers?.stationLines?.[s.id] || [] }));
  // 每區、每站每小時的真實進出人數（站層級總量，不受少於 10 人限制，AD-3）
  const act = {}, ent = {}, ext = {}, stAct = {};
  for (const day of ['weekday', 'holiday']) {
    act[day] = []; ent[day] = []; ext[day] = []; stAct[day] = [];
    for (let h = 0; h < 24; h++) {
      const a = new Array(D.length).fill(0), e = new Array(D.length).fill(0), x = new Array(D.length).fill(0), sa = new Array(S.length).fill(0);
      for (const s of S) {
        const en = s[day].entries[h] || 0, ex = s[day].exits[h] || 0;
        sa[s.i] = en + ex;
        if (s.di === undefined) continue;
        e[s.di] += en; x[s.di] += ex; a[s.di] += en + ex;
      }
      act[day].push(a); ent[day].push(e); ext[day].push(x); stAct[day].push(sa);
    }
  }
  let maxAct = 1, maxFlow = 1, maxSt = 1;
  for (const day of ['weekday', 'holiday']) for (let h = 0; h < 24; h++) {
    for (const v of act[day][h]) maxAct = Math.max(maxAct, v);
    for (const v of stAct[day][h]) maxSt = Math.max(maxSt, v);
    const M = flows[day][h]; if (!M) continue;
    M.forEach((row, i) => row.forEach((v, j) => { if (i !== j && v) maxFlow = Math.max(maxFlow, v); }));
  }
  const dayTotal = D.map((_, i) => act.weekday.reduce((s, a) => s + a[i], 0));
  const stDay = S.map((_, i) => stAct.weekday.reduce((s, a) => s + a[i], 0));
  // 投影：以這 21 區的範圍定原點與比例（AD-12 的 project()；正式版常數寫死在 projection.ts）
  let lo0 = Infinity, lo1 = -Infinity, la0 = Infinity, la1 = -Infinity;
  for (const d of D) for (const poly of d.polygon) for (const ring of poly) for (const [lo, la] of ring) {
    lo0 = Math.min(lo0, lo); lo1 = Math.max(lo1, lo); la0 = Math.min(la0, la); la1 = Math.max(la1, la);
  }
  const lon0 = (lo0 + lo1) / 2, lat0 = (la0 + la1) / 2, kx = Math.cos(lat0 * Math.PI / 180);
  const scale = 100 / Math.max((lo1 - lo0) * kx, la1 - la0);
  const project = (lon, lat) => [(lon - lon0) * kx * scale, -(lat - lat0) * scale];
  const unproject = (x, z) => [x / (kx * scale) + lon0, -z / scale + lat0];
  DATA = { D, S, flows, layers, events, act, ent, ext, stAct, maxAct, maxFlow, maxSt, dayTotal, stDay, project, unproject, extent: [(lo1 - lo0) * kx * scale, (la1 - la0) * scale] };
  return DATA;
}

};

const fract = (v) => v - Math.floor(v);
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const RUSH = (h) => (h >= 7 && h < 10) || (h >= 17 && h < 20);

// 太陽：2026 年 9 月臺北約 5:40 日出、18:00 日落（原型不追求天文精度）
const RISE = 5.7, SET = 18.0;
function sunState(h) {
  const t = (h - RISE) / (SET - RISE);
  const elev = Math.sin(Math.PI * t);
  const az = Math.PI * clamp(t, 0, 1);                     // 0＝東、π/2＝南、π＝西
  const day = smooth(-0.08, 0.32, elev);
  const night = 1 - smooth(-0.3, 0.06, elev);
  const golden = clamp(1 - Math.abs(elev - 0.1) / 0.3, 0, 1) * (elev > -0.15 ? 1 : 0);
  const twilight = clamp(1 - Math.abs(elev) / 0.32, 0, 1);
  const tn = fract((h - SET) / (24 - (SET - RISE)));
  return { t, elev, az, day, night, golden, twilight, tn, isDay: elev > 0 };
}

function makeTokens() {
  const cs = getComputedStyle(document.documentElement);
  const cache = new Map();
  const raw = (name) => cs.getPropertyValue(name).trim();
  const color = (name) => {
    if (!cache.has(name)) { const v = raw(name); cache.set(name, v && !v.startsWith('rgba') ? new THREE.Color(v) : null); }
    return cache.get(name);
  };
  const KEYS = [[0, 'night'], [4.8, 'night'], [5.7, 'dawn'], [6.6, 'dawn'], [7.6, 'day'], [16.6, 'day'], [17.6, 'dusk'], [18.4, 'dusk'], [19.3, 'night'], [24, 'night']];
  const at = (name, h, out = new THREE.Color()) => {
    const plain = color(`--${name}`);
    let k = 0; while (k < KEYS.length - 2 && h >= KEYS[k + 1][0]) k++;
    const [h0, p0] = KEYS[k], [h1, p1] = KEYS[k + 1];
    const c0 = color(`--${name}-${p0}`) || plain, c1 = color(`--${name}-${p1}`) || plain;
    if (!c0) return out.set(0, 0, 0);
    return out.copy(c0).lerp(c1 || c0, clamp((h - h0) / (h1 - h0), 0, 1));
  };
  return { color: (n) => (color(n) || new THREE.Color()).clone(), at, css: (n) => raw(n) };
}

function hourTitle(data, day, h) {
  const hh = Math.floor(h) % 24;
  if (!data.flows[day][hh] || hh === 5) return hh === 5 ? '第一班車前後' : '停止營運';
  if (hh === 6) return '城市醒來';
  if (hh >= 7 && hh < 10) return day === 'weekday' ? '早晨通勤尖峰' : '假日早晨';
  if (hh >= 10 && hh < 12) return '上午';
  if (hh >= 12 && hh < 14) return '午間';
  if (hh >= 14 && hh < 17) return '下午';
  if (hh >= 17 && hh < 20) return day === 'weekday' ? '傍晚下班尖峰' : '假日傍晚';
  if (hh >= 20 && hh < 23) return '夜晚';
  return '末班車時段';
}

    const skyTop = new THREE.Color(), skyHor = new THREE.Color(), skyLow = new THREE.Color();

    }

    function resize() {
      const w = innerWidth, h = innerHeight;
      renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
      composer?.setSize(w, h); bloom?.setSize(w * 0.5, h * 0.5);
      if (hTilt) { hTilt.uniforms.h.value = 3.2 / w; vTilt.uniforms.v.value = 3.2 / h; }
      DIST.forEach((x) => x.rail?.material.resolution.set(w, h));
    }
    on(window, 'resize', resize); resize();

    function rebuildIfNeeded(force = false) {
      const hh = Math.floor(S.hour) % 24;
      const ctx = `${EV?.date}|${S.day}|${S.sel}|${S.station}|${!!stationRow}|${S.focusArc}|${S.commute?.arc.key}|${S.still}|${layerState.flow}`;
      const sig = `${ctx}|${hh}`;
      if (force || sig !== arcSig) { const animate = ctx !== ctxSig; arcSig = sig; ctxSig = ctx; rebuildArcs(animate); }
    }
    applyLayers();
    if (new URLSearchParams(location.search).has('debug')) { window.__cb = { S, controls, selectLandmark: (k) => selectLandmark(k), get arcs() { return arcs; }, lmScreen: (k) => { const L = lmTop[k]; L.g.getWorldPosition(P); P.y += L.top * 0.5; P.project(camera); return [(P.x * 0.5 + 0.5) * innerWidth, (-P.y * 0.5 + 0.5) * innerHeight]; } }; gsap.ticker.lagSmoothing(0); }   // 測試用：無頭瀏覽器很慢，關掉 lag smoothing 讓補間照實際時間跑完

    // ── 每一格 ──
    const timer = new THREE.Timer(); timer.connect(document);
    const dummy = new THREE.Object3D(), TP = {};
    let t = 0, lastHourInt = -1, frameNo = 0, trainT = 0, celebT = 0, prevH = S.hour;
    function frame() {
      raf = requestAnimationFrame(frame);
      timer.update(); const dt = Math.min(timer.getDelta(), 0.1);
      t += dt; frameNo++;
      if (S.playing && !S.still) S.hour = (S.hour + dt * 0.5 * S.speed) % 24;   // 48 秒一天
      const h = S.hour, hh = Math.floor(h) % 24, h2 = (hh + 1) % 24, f = h - Math.floor(h);
      const sunS = sunState(h);
      if (hh !== lastHourInt) {
        lastHourInt = hh;
        if (S.station >= 0 && S.shard) stationRow = S.shard[S.day][hh] || [];
        if (!S.commute && !sheet.hidden) { if (S.station >= 0) renderStationCard(S.shard || null); else if (S.sel >= 0) renderDistrictCard(); else if (S.sheetKind === 'event') renderEventCard(); else if (S.focusArc) renderFlowCard(); }
      }
      updateClock(sunS);
      maybeToast(hourTitle(data, S.day, h));
      updateSky(h, sunS);

      if (sunS.elev > 0) {
        const e = sunS.elev * 1.1, R = 160;
        sun.position.set(Math.cos(sunS.az) * Math.cos(e) * R, Math.sin(e) * R + 8, Math.sin(sunS.az) * Math.cos(e) * R * 0.85);
        sun.intensity = V.sun * (0.38 + 0.62 * smooth(0, 0.35, sunS.elev));
      } else {
        sun.position.set(-70, 120, -60);
        sun.intensity = V.moon * sunS.night;
      }
      T.at('light', h, sun.color);
      T.at('amb-sky', h, hemi.color); T.at('amb-ground', h, hemi.groundColor);
      const lit = Math.max(sunS.day, sunS.twilight * 0.62);
      hemi.intensity = V.hemi[0] + (V.hemi[1] - V.hemi[0]) * lit;
      renderer.toneMappingExposure = V.exposure[0] + (V.exposure[1] - V.exposure[0]) * lit;
      blob.material.opacity = 0.18 + 0.3 * sunS.day;
      for (const [m, prop, token] of phased) T.at(token, h, m[prop]);
      if (bloom) { bloom.strength = V.bloom * (0.25 + 0.75 * sunS.night); bloom.enabled = bloom.strength > 0.02; }
      if (grade) {
        T.at('grade-lift', h, grade.uniforms.uLift.value); T.at('grade-gain', h, grade.uniforms.uGain.value);
        grade.uniforms.uSat.value = 1.08 + 0.14 * sunS.golden - 0.12 * sunS.night;
        grade.uniforms.uVig.value = 0.22 + 0.3 * sunS.night;
      }

      // 行政區呼吸：街廓高度＝當下（相鄰兩個整點內插）的真實進出人數；窗光入夜亮起，深夜漸少
      const A0 = actAt(hh), A1 = actAt(h2);
      const win = V.winNight * smooth(0.25, 0.9, sunS.night) + 0.15 * sunS.golden;
      WIN.lit.value = 0.62 - 0.32 * smooth(0, 4, (h + 24 - 20) % 24) * (h < 6 || h >= 20 ? 1 : 0);
      DIST.forEach((x, k) => {
        const a = A0[k] * (1 - f) + A1[k] * f;
        const idle = S.still ? 0 : Math.sin(t * 1.6 + k * 0.9) * 0.02;
        x.group.position.y = x.lift;
        x.group.scale.y = Math.max(0.03, x.rise * x.press);
        const breath = 0.7 + 0.5 * Math.sqrt(a / data.maxAct) + idle;
        x.bld.scale.y = x.crown.scale.y = Math.max(0.02, breath);
        x.wall.emissiveIntensity = win;
        for (const m of x.mats) { m.transparent = x.fade < 0.999; m.opacity = x.fade; if (m.userData.glow) m.emissiveIntensity = win * 0.6; }
        if (x.rail) x.rail.material.opacity = 0.25 + 0.75 * x.fade;
      });

      // 車站：細柱高度依此刻進出人數，站珠浮在柱頂；夜裡發光
      const SA0 = stActAt(hh), SA1 = stActAt(h2), SAh = new Array(ST.length);
      for (let i = 0; i < ST.length; i++) {
        const s = ST[i];
        if (s.di === undefined) { SAh[i] = 0; dummy.position.set(0, -50, 0); dummy.scale.setScalar(0.0001); dummy.updateMatrix(); stCol.setMatrixAt(i, dummy.matrix); stCap.setMatrixAt(i, dummy.matrix); stPlaza.setMatrixAt(i, dummy.matrix); continue; }
        const a = SA0[i] * (1 - f) + SA1[i] * f; SAh[i] = a;
        const base = topOf(s.di) + stLift[i], rise = DIST[s.di].rise, chosen = i === S.station || (S.commute && (i === S.commute.o || i === S.commute.d));
        const colH = (0.35 + 2.1 * Math.sqrt(a / data.maxSt)) * rise;
        dummy.position.set(stPos[i][0], base, stPos[i][1]); dummy.scale.set(1, colH, 1); dummy.updateMatrix(); stCol.setMatrixAt(i, dummy.matrix);
        dummy.scale.setScalar(rise); dummy.updateMatrix(); stPlaza.setMatrixAt(i, dummy.matrix);
        capY[i] = base + colH + 0.2;
        const cs = (chosen ? 1.6 : 1) * stPop[i] * rise;
        dummy.position.y = capY[i]; dummy.scale.setScalar(Math.max(0.001, cs)); dummy.updateMatrix(); stCap.setMatrixAt(i, dummy.matrix);
      }
      [stCol, stCap, stPlaza].forEach((m) => { m.instanceMatrix.needsUpdate = true; });
      capMat.emissiveIntensity = 0.25 + 1.5 * sunS.night;

      // 徽章寶石：浮在站珠上方慢慢轉；已收集的變小、變青綠
      BADGES.forEach((b, k) => {
        const i = b.si; if (i < 0) return;
        dummy.position.set(stPos[i][0], capY[i] + 1.15 + (S.still ? 0 : Math.sin(t * 2 + k) * 0.15), stPos[i][1]);
        dummy.rotation.set(0, S.still ? 0 : t * 1.4 + k, 0); dummy.scale.setScalar(found.has(b.id) ? 0.7 : 1); dummy.updateMatrix(); gems.setMatrixAt(k, dummy.matrix);
      });
      dummy.rotation.set(0, 0, 0); gems.instanceMatrix.needsUpdate = true; gems.visible = layerState.station;
      gemMat.emissiveIntensity = 0.45 + 0.9 * sunS.night;
      // 此刻最忙：皇冠
      let topSi = -1; for (let i = 0; i < ST.length; i++) if (ST[i].di !== undefined && (topSi < 0 || SAh[i] > SAh[topSi])) topSi = i;
      if (topSi >= 0 && SAh[topSi] > 0) {
        if (topSi !== crownSi) { const first = crownSi < 0; crownSi = topSi; if (!S.still && !first) { crownPop.s = 0.2; tw(gsap.to(crownPop, { s: 1, duration: 0.6, ease: 'back.out(2.5)' })); sfx('crown'); } }
        const gemHere = BADGES.some((b) => b.si === crownSi);
        crown.position.set(stPos[crownSi][0], capY[crownSi] + (gemHere ? 2.1 : 1.1), stPos[crownSi][1]); crown.rotation.y = S.still ? 0 : t * 0.8; crown.scale.setScalar(crownPop.s);
        crown.visible = layerState.station;
        if (frameNo % 8 === 1) updateTopChip(SAh[crownSi]);
      } else { crown.visible = false; topChip.hidden = true; }
      // 地標動畫；大日子的高峰前後，場館噴彩紙、打光
      const celebrate = EV && Math.abs(h - (EV.peakH + 0.5)) < 1.6 ? EV.ev.venue : null;
      const lctx = { hh, night: sunS.night, ev: EV?.ev, celebrate };
      lmAnims.forEach((a) => a.update(t, lctx));
      if (celebrate && !S.still) {
        celebT -= dt;
        if (celebT <= 0) {
          celebT = 0.9; const k = LANDMARKS.findIndex((l) => l.venue === celebrate), L = lmTop[k];
          if (L) { L.g.getWorldPosition(Q); Q.y += L.top; } else Q.set(stPos[EV.si][0], capY[EV.si] + 1, stPos[EV.si][1]);
          burst(Q, 40, 0.9);
        }
      }
      // 第一班車：6 點一到，各站從台北車站往外一圈圈亮起來
      if (S.playing && !S.still && prevH < 6 && h >= 6 && h < 7) {
        const c0 = stPos[stIndex('台北車站')] || [0, 0];
        ST.forEach((_, i) => { const d0 = Math.hypot(stPos[i][0] - c0[0], stPos[i][1] - c0[1]); const o = { v: 1 }; tw(gsap.to(o, { keyframes: [{ v: 1.8, duration: 0.18 }, { v: 1, duration: 0.5, ease: 'elastic.out(1.2, 0.4)' }], delay: d0 * 0.03, onUpdate: () => { stPop[i] = o.v; } })); });
        sfx('wake');
      }
      prevH = h;
      // 彩紙
      for (let k = 0; k < CONF; k++) {
        if (cL[k] > 0) {
          cL[k] -= dt; cV[k * 3 + 1] -= 9 * dt; for (let a = 0; a < 3; a++) { cV[k * 3 + a] *= 0.985; cP[k * 3 + a] += cV[k * 3 + a] * dt; }
          dummy.position.set(cP[k * 3], cP[k * 3 + 1], cP[k * 3 + 2]); dummy.rotation.set(cR[k] + t * 6, cR[k] * 2 + t * 4, 0); dummy.scale.setScalar(Math.min(1, cL[k] * 2));
        } else { dummy.position.set(0, -60, 0); dummy.scale.setScalar(0.0001); }
        dummy.updateMatrix(); conf.setMatrixAt(k, dummy.matrix);
      }
      dummy.rotation.set(0, 0, 0); conf.instanceMatrix.needsUpdate = true;

      // 列車（示意）：間隔＝班距（分鐘）×1.6 單位；營運時間外沒有列車
      let nT = 0;
      const showT = layerState.train && layerState.rail && !S.still;
      if (showT) {
        trainT += dt * S.speed * (S.playing ? 1 : 0.6);
        for (const tk of TR) {
          const H = headwayOf(tk.line, hh); if (!H) continue;
          const gap = H * 1.6, n = Math.max(1, Math.floor(tk.len / gap));
          for (let dir = 0; dir < 2; dir++) for (let j = 0; j < n && nT < TRAIN_CAP; j++) {
            let sPos = (j * tk.len / n + trainT * 2.4 + dir * tk.len / n / 2) % tk.len; if (dir) sPos = tk.len - sPos;
            trackAt(tk, sPos, TP);
            const off = dir ? -0.16 : 0.16, lift = TP.di >= 0 ? DIST[TP.di].group.position.y : 0, rise = TP.di >= 0 ? DIST[TP.di].rise : 1;
            dummy.position.set(TP.x - TP.dz * off, (lift + TILE_TOP) * 1 + 0.2 * rise, TP.z + TP.dx * off);
            dummy.rotation.set(0, Math.atan2(-TP.dz, TP.dx), 0); dummy.scale.setScalar(rise); dummy.updateMatrix();
            trains.setMatrixAt(nT, dummy.matrix); trains.setColorAt(nT, tk.color); nT++;
          }
        }
      }
      dummy.rotation.set(0, 0, 0);
      trains.count = nT; trains.instanceMatrix.needsUpdate = true; if (trains.instanceColor) trains.instanceColor.needsUpdate = true;
      trainMat.emissiveIntensity = 0.1 + 0.7 * sunS.night;

      // 雲：白天飄、夜裡淡出
      cloudMat.opacity = 0.85 * smooth(0.05, 0.6, lit) * smooth(95, 150, controls.distance);   // 放大看細節時雲淡出，不擋畫面
      clouds.forEach((c) => {
        c.visible = layerState.cloud && cloudMat.opacity > 0.02;
        if (!S.still) { c.position.x += c.userData.v * dt * S.speed; if (c.position.x > PW / 2 + 14) c.position.x = -PW / 2 - 14; }
      });

      rebuildIfNeeded();
      if (!S.still) chevTex.offset.x = -t * (RUSH(hh) ? 1.3 : 0.7);

      let n = 0;
      const showP = !S.still && layerState.flow;
      particles.visible = showP;
      if (showP) {
        const rush = RUSH(hh) ? 1.6 : 1, speed = 7 * rush, rate = 0.55 * rush, hi = particleHi;
        for (const a of arcs) {
          if (S.focusArc && S.focusArc !== a.key && a.kind !== 'commute') continue;
          for (let i = 0; i < a.n && n < CAP; i++) {
            const u = 0.05 + 0.9 * fract(i / a.n + t * speed / a.len + a.phase);
            if (u > 0.05 + 0.9 * a.reveal) continue;
            const pulse = Math.pow(fract(t * rate - u * 1.6 + a.phase), 3.0);
            bez(a, u, P); bezTan(a, u, TAN);
            dummy.position.set(P.x, P.y + 0.12, P.z); dummy.lookAt(P.x + TAN.x, P.y + 0.12 + TAN.y, P.z + TAN.z);
            dummy.scale.setScalar(0.75 + 0.6 * pulse); dummy.updateMatrix();
            particles.setMatrixAt(n, dummy.matrix);
            particles.setColorAt(n, tmpC.copy(a.color).lerp(hi, 0.35 + 0.65 * pulse));
            n++;
          }
        }
        dummy.rotation.set(0, 0, 0);
      }
      particles.count = n; particles.instanceMatrix.needsUpdate = true; if (particles.instanceColor) particles.instanceColor.needsUpdate = true;

      const dests = []; const seen = new Set();
      for (const a of arcs) {
        const key = a.d !== undefined ? `s${a.d}` : `d${a.to}`;
        if (seen.has(key) || (S.focusArc && S.focusArc !== a.key && a.kind !== 'commute')) continue;
        seen.add(key); dests.push(a);
      }
      rings.forEach((r, k) => {
        const a = dests[k];
        if (!a || S.still || a.reveal < 1) { r.visible = false; return; }
        const rf = fract(t * 0.55 * (RUSH(hh) ? 1.6 : 1) + a.phase);
        r.visible = true; r.position.set(a.p2.x, a.p2.y - 0.2, a.p2.z);
        r.scale.setScalar(0.6 + rf * (2.5 + a.w * 2.2)); r.material.opacity = (1 - rf) * (1 - rf) * 0.75;
      });

      if (S.playing && !S.still && S.sel < 0 && S.station < 0 && !S.commute && performance.now() - S.idleAt > 3000) controls.rotate(Math.sin(t * 0.25) * 0.00025, 0, false);
      controls.update(dt);
      if (frameNo % 6 === 1) { const before = pxPerUnit; measurePx(); if (Math.abs(before - pxPerUnit) > 0.15) renderLegend(); }
      const taken = [];
      updateBadge();
      if (!badge.hidden) { const r = badge.getBoundingClientRect(); taken.push([r.left, r.top, r.right, r.bottom]); }
      for (const el of labelEls) {
        if (!el.arc || !layerState.flow || el.arc.reveal < 1) { el.hidden = true; continue; }
        bez(el.arc, 0.5, P); P.y += 0.6; P.project(camera);
        const x = (P.x * 0.5 + 0.5) * innerWidth, y0 = (-P.y * 0.5 + 0.5) * innerHeight, w = el._w || 90, hgt = el._h || 34;
        let y = null;
        for (const cand of [y0, y0 - hgt - 4, y0 + hgt + 4]) {
          const r = [x - w / 2, cand - hgt, x + w / 2, cand];
          if (!taken.some((q) => r[0] < q[2] && r[2] > q[0] && r[1] < q[3] && r[3] > q[1])) { y = cand; taken.push(r); break; }
        }
        el.hidden = y === null || P.z > 1; if (el.hidden) continue;
        el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) translate(-50%, -100%)`;
      }
      updateLabels(taken, SAh);
      if (composer) composer.render(); else renderer.render(scene, camera);
    }
    frame();

    return {
      dispose() {
        cancelAnimationFrame(raf); controls.dispose(); timer.dispose(); clearTimeout(toastTimer);
        scene.traverse((o) => { o.geometry?.dispose(); const m = o.material; (Array.isArray(m) ? m : m ? [m] : []).forEach((x) => { x.map?.dispose(); x.dispose(); }); });
        composer?.dispose(); renderer.dispose();
      },
    };
  }

  return {
    dispose() {
      disposed = true; ac.abort(); tweens.forEach((x) => x.kill());
      api?.dispose(); root.remove();
    },
  };
}

// ───────────────────────── 啟動（2026-11-10 Piwi 選定「天光」，不再切換版本） ─────────────────────────
startApp(document.getElementById('stage'), 0);
</script>
