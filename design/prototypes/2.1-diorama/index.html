<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>城市呼吸 2.1 微縮城市 第三輪</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 2.1 原型第三輪：三個版本共用疊圖、車站視角、街廓建築、列車與點選回饋，只差日夜光影的做法。
   所有顏色只在這裡以 token 定義，JS 與 shader 由 getComputedStyle 讀取（AD-8）。
   日夜：token 名稱後綴 -night／-dawn／-day／-dusk，JS 依時刻在相鄰兩組之間內插；沒有後綴的 token 全天共用。 */
:root {
  --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --radius: 14px;
  /* 捷運路線色：臺北捷運路線資料服務（data.taipei）的 LineColor 欄位 */
  --line-br: #b57a25;
  --line-r: #d90023;
  --line-r3: #ef9298;
  --line-g: #107547;
  --line-g3: #d2de1a;
  --line-o: #f5a818;
  --line-bl: #0a59ae;
  /* 環狀線由新北捷運營運，不在臺北捷運的路線資料裡；先用黃色，正式版查新北捷運的官方色碼 */
  --line-y: #f2c500;
  --flow-neutral: #e9781e;
  --flow-in: #e2582b;
  --flow-out: #2a7fd0;
  --commute: #d63a48;
  --ripple: #ffd9a0;
  --particle-hi: #fffaf0;
  --shadow: #1c160c;
  /* 建築與樹的色調：乘在材質色上，讓同一區有三種牆色、兩種樹色 */
  --bld-tint-1: #ffffff; --bld-tint-2: #f1e8dc; --bld-tint-3: #e1e8ee;
  --accent-1: #e39a80; --accent-2: #9fc2b4; --accent-3: #e9c98a;
  --tree-tint-1: #ffffff; --tree-tint-2: #dcebc9;
  /* 地標（示意）：台北 101、圓山大飯店、中正紀念堂 */
  --lm-glass: #8db1c2; --lm-red: #b9483b; --lm-gold: #e2b24c; --lm-white: #f5f1e8; --lm-blue: #2e5d9b;
  --cloud: #ffffff;
  --train-glow: #fff4d6;
  --star: #ffffff;
  --sun-disc: #fff3cf;
  --sun-glow: rgba(255, 205, 120, 0.55);
  --moon-disc: #e9edff;
  --moon-glow: rgba(190, 205, 255, 0.35);
  /* HUD：白天亮玻璃、夜晚暗玻璃（data-phase 由 JS 依太陽高度切換） */
  --hud-bg: rgba(255, 252, 246, 0.86);
  --hud-ink: #1b2033;
  --hud-muted: #586079;
  --hud-line: rgba(27, 32, 51, 0.12);
  --hud-accent: #2a7fd0;
  --hud-chip: rgba(27, 32, 51, 0.07);
  --hud-on: #ffffff;
}
:root[data-phase="night"] {
  --hud-bg: rgba(14, 18, 38, 0.80);
  --hud-ink: #eef1ff;
  --hud-muted: #a3acd0;
  --hud-line: rgba(255, 255, 255, 0.14);
  --hud-accent: #7fb6ff;
  --hud-chip: rgba(255, 255, 255, 0.08);
  --hud-on: #0e1226;
}

/* A 天光：材質固定，日夜全靠光——太陽東升西落、陰影跟著轉，夜裡月光、窗光、站燈 */
:root[data-variant="a"] {
  --sky-top-night: #0a0f26;  --sky-horizon-night: #1e2a50;
  --sky-top-dawn: #3a4c8c;   --sky-horizon-dawn: #f7b48f;
  --sky-top-day: #5aa6e0;    --sky-horizon-day: #d9eeff;
  --sky-top-dusk: #35306f;   --sky-horizon-dusk: #f2895a;
  --light-night: #7b8ce0; --light-dawn: #ffb27a; --light-day: #fff2dc; --light-dusk: #ff8f52;
  --amb-sky-night: #2a3466; --amb-sky-dawn: #b9b6dc; --amb-sky-day: #d3e8ff; --amb-sky-dusk: #bba6d0;
  --amb-ground-night: #12141f; --amb-ground-dawn: #7a6a66; --amb-ground-day: #b5a58c; --amb-ground-dusk: #76605e;
  --plinth: #d8c9ac; --plinth-side: #a48d6b; --plinth-line: #b5a382;
  --tile: #f3ede1; --tile-side: #d6c9b2;
  --water: #7db3dc; --green: #a8cf8c;
  --building: #ffffff; --roof: #ebe4d6; --window: #ffcb72;
  --station: #fbf7ef; --station-glow: #ffe0a0;
  --tree: #93bf74; --strata-1: #b39a74; --strata-2: #8c7457;
}

/* B 調色：每個時段一組配色＋畫面調色（lift/gain）＋三階卡通光，夜裡窗光與流向發光 */
:root[data-variant="b"] {
  --sky-top-night: #0b0b2e;  --sky-horizon-night: #2b2266;
  --sky-top-dawn: #5b4aa6;   --sky-horizon-dawn: #ffb3a1;
  --sky-top-day: #48a8ec;    --sky-horizon-day: #e6f6ff;
  --sky-top-dusk: #4a2a7a;   --sky-horizon-dusk: #ff9a5c;
  --light-night: #8c8cff; --light-dawn: #ffb08f; --light-day: #fff6e8; --light-dusk: #ff9a5c;
  --amb-sky-night: #34307a; --amb-sky-dawn: #e2b5c8; --amb-sky-day: #dff0ff; --amb-sky-dusk: #e3a0a6;
  --amb-ground-night: #191433; --amb-ground-dawn: #7d5a66; --amb-ground-day: #b9b09a; --amb-ground-dusk: #7a4a52;
  --plinth-night: #2c2a5e; --plinth-dawn: #d9bfb8; --plinth-day: #e3d6bb; --plinth-dusk: #d6a88c;
  --plinth-side-night: #1b1a40; --plinth-side-dawn: #a68a86; --plinth-side-day: #b2a07c; --plinth-side-dusk: #a5765e;
  --plinth-line: #b8a98a;
  --tile-night: #3b3f7a; --tile-dawn: #f6d6cc; --tile-day: #fcf5e6; --tile-dusk: #f5c09c;
  --tile-side-night: #2a2c5c; --tile-side-dawn: #d9b3aa; --tile-side-day: #e0d2b8; --tile-side-dusk: #d99a78;
  --water-night: #233a8a; --water-dawn: #a7b9ee; --water-day: #6fc0f0; --water-dusk: #8d8fd8;
  --green-night: #2f5a6a; --green-dawn: #b9cf9c; --green-day: #9fd67f; --green-dusk: #b7b27a;
  --building-night: #4a4f8c; --building-dawn: #fbe9e1; --building-day: #ffffff; --building-dusk: #fbd9c2;
  --roof-night: #3e4280; --roof-dawn: #efd2c8; --roof-day: #f1ead9; --roof-dusk: #f0c3a4;
  --window: #ffd27a;
  --station: #f6f2ff; --station-glow: #ffe6a8;
  --tree-night: #2b5560; --tree-dawn: #a9c48c; --tree-day: #7cc463; --tree-dusk: #a7a66a;
  --strata-1-night: #221f4a; --strata-1-dawn: #a88a7e; --strata-1-day: #a7906c; --strata-1-dusk: #9a6e58;
  --strata-2-night: #171537; --strata-2-dawn: #806660; --strata-2-day: #7f6a50; --strata-2-dusk: #744f40;
  --cloud-night: #3c3f7a; --cloud-dawn: #ffe2dc; --cloud-day: #ffffff; --cloud-dusk: #ffd0b8;
  --grade-lift-night: #1a2a7a; --grade-gain-night: #a9b4ff;
  --grade-lift-dawn: #7a3a62;  --grade-gain-dawn: #ffe2d4;
  --grade-lift-day: #000000;   --grade-gain-day: #ffffff;
  --grade-lift-dusk: #6a2448;  --grade-gain-dusk: #ffd2a4;
}

/* C 移軸：像拍真的微縮模型——低一點的鏡頭、上下景深模糊、暖色主光，夜裡城市燈光微微暈開 */
:root[data-variant="c"] {
  --sky-top-night: #0c1024;  --sky-horizon-night: #26304f;
  --sky-top-dawn: #44558f;   --sky-horizon-dawn: #f4b995;
  --sky-top-day: #78b6e2;    --sky-horizon-day: #eaf3f6;
  --sky-top-dusk: #3f3a74;   --sky-horizon-dusk: #ef9a6a;
  --light-night: #8293e6; --light-dawn: #ffb886; --light-day: #fff0d6; --light-dusk: #ff9a5e;
  --amb-sky-night: #283363; --amb-sky-dawn: #bfb6d6; --amb-sky-day: #dbe9f6; --amb-sky-dusk: #c4a8c8;
  --amb-ground-night: #14151f; --amb-ground-dawn: #7e6a60; --amb-ground-day: #c0ad8e; --amb-ground-dusk: #7a5e58;
  --plinth: #cdb894; --plinth-side: #8f7656; --plinth-line: #a99572;
  --tile: #f6eedd; --tile-side: #dccbad;
  --water: #63a9da; --green: #93cd74;
  --building: #fffdf7; --roof: #efe3cc; --window: #ffc768;
  --station: #fffaf0; --station-glow: #ffdc96;
  --tree: #8cc36c; --strata-1: #ad946c; --strata-2: #81694c;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--sky-horizon-day); }
body { font-family: var(--font); color: var(--hud-ink); -webkit-font-smoothing: antialiased; }
#stage { position: fixed; inset: 0; }
.app { position: absolute; inset: 0; }
.app canvas.scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.num { font-variant-numeric: tabular-nums; }

/* 天空：畫在場景後面，顏色由 JS 依時刻寫入 */
.sky { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.sky .stars { position: absolute; inset: 0; }
.sky .stars i { position: absolute; width: 2px; height: 2px; border-radius: 999px; background: var(--star); }
.sky .sun, .sky .moon { position: absolute; left: 0; top: 0; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 999px; }
.sky .sun { background: var(--sun-disc); box-shadow: 0 0 0 10px var(--sun-glow), 0 0 60px 30px var(--sun-glow); }
.sky .moon { width: 26px; height: 26px; margin: -13px 0 0 -13px; background: var(--moon-disc); box-shadow: 0 0 30px 12px var(--moon-glow); }

.hud { position: absolute; color: var(--hud-ink); background: var(--hud-bg);
  -webkit-backdrop-filter: blur(14px) saturate(1.3); backdrop-filter: blur(14px) saturate(1.3);
  border: 1px solid var(--hud-line); border-radius: var(--radius);
  transition: background-color 600ms ease, color 600ms ease, border-color 600ms ease; }
@media (prefers-reduced-motion: reduce) { .hud { transition: none; } }
.hud button, .hud select { font: inherit; color: inherit; }
.hud button:focus-visible, .hud select:focus-visible, .hud input:focus-visible { outline: 2px solid var(--hud-accent); outline-offset: 2px; }

.loading { position: absolute; inset: 0; display: grid; place-items: center; margin: 0; font-size: 14px; color: var(--hud-muted); pointer-events: none; }

/* 上方：找你的通勤＋圖層 */
.commute-pill { top: calc(env(safe-area-inset-top, 0px) + 66px); left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 999px; cursor: pointer; font-size: 14px; font-weight: 500; }
.commute-pill svg, .layer-btn svg { width: 16px; height: 16px; }
.layer-btn { top: calc(env(safe-area-inset-top, 0px) + 66px); right: 12px; width: 40px; height: 40px; border-radius: 999px; display: grid; place-items: center; cursor: pointer; padding: 0; }
.layer-btn[aria-expanded="true"] { border-color: var(--hud-accent); }
.layer-panel { top: calc(env(safe-area-inset-top, 0px) + 112px); right: 12px; width: min(260px, calc(100vw - 24px)); padding: 10px; display: grid; gap: 2px; }
.layer-panel h2 { margin: 2px 6px 6px; font-size: 13px; font-weight: 700; }
.layer-panel label { display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 10px; min-height: 40px; padding: 0 6px; border-radius: 10px; cursor: pointer; font-size: 14px; }
.layer-panel label:active { background: var(--hud-chip); }
.layer-panel .sw { width: 18px; height: 18px; border-radius: 6px; }
.layer-panel .sw.rail { background: linear-gradient(135deg, var(--line-r) 0 25%, var(--line-bl) 25% 50%, var(--line-g) 50% 75%, var(--line-o) 75%); }
.layer-panel .sw.flow { background: var(--flow-neutral); }
.layer-panel .sw.station { background: var(--line-r); border-radius: 999px; transform: scale(0.6); box-shadow: 0 0 0 3px var(--hud-chip); }
.layer-panel .sw.water { background: var(--water, var(--water-day)); }
.layer-panel .sw.green { background: var(--green, var(--green-day)); }
.layer-panel .sw.building { background: var(--roof, var(--roof-day)); border: 1px solid var(--hud-line); }
.layer-panel .sw.train { background: var(--line-bl); border-radius: 999px; transform: scaleY(0.45); }
.layer-panel .sw.cloud { background: var(--hud-chip); border: 1px solid var(--hud-line); border-radius: 999px; }
.layer-panel .sw.label { background: none; border: 1px solid var(--hud-muted); font-size: 10px; display: grid; place-items: center; color: var(--hud-muted); }
.layer-panel small { color: var(--hud-muted); font-size: 11px; }
.layer-panel input { appearance: none; -webkit-appearance: none; width: 36px; height: 22px; border-radius: 999px; background: var(--hud-chip); border: 1px solid var(--hud-line); position: relative; margin: 0; cursor: pointer; }
.layer-panel input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 999px; background: var(--hud-muted); transition: transform 160ms ease, background-color 160ms ease; }
.layer-panel input:checked { background: var(--hud-accent); border-color: transparent; }
.layer-panel input:checked::after { transform: translateX(14px); background: var(--hud-on); }
@media (prefers-reduced-motion: reduce) { .layer-panel input::after { transition: none; } }
.layer-panel .src { margin: 6px 6px 2px; font-size: 11px; line-height: 1.5; color: var(--hud-muted); }

.commute-panel { top: calc(env(safe-area-inset-top, 0px) + 114px); left: 50%; transform: translateX(-50%);
  width: min(420px, calc(100vw - 32px)); padding: 14px; display: grid; gap: 10px; }
.commute-panel h2 { margin: 0; font-size: 15px; }
.commute-panel label { display: grid; gap: 4px; font-size: 12px; color: var(--hud-muted); }
.commute-panel select { height: 38px; border-radius: 10px; border: 1px solid var(--hud-line); background: var(--hud-chip); padding: 0 8px; font-size: 14px; color: var(--hud-ink); }
.commute-panel .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.commute-panel .actions { display: flex; gap: 8px; justify-content: flex-end; }

.btn { height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--hud-line); background: var(--hud-chip); cursor: pointer; font-size: 13px; }
.btn.primary { background: var(--hud-accent); border-color: transparent; color: var(--hud-on); font-weight: 700; }
.btn:active, .layer-btn:active, .commute-pill:active { transform: scale(0.97); }
.commute-pill:active { transform: translateX(-50%) scale(0.97); }

/* 下方：時間軸＋圖例 */
.dock { left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); max-width: 640px; margin: 0 auto;
  padding: 10px 12px; display: grid; gap: 8px; }
.dock .top { display: flex; align-items: center; gap: 10px; }
.play { width: 40px; height: 40px; border-radius: 999px; border: 0; background: var(--hud-accent); color: var(--hud-on); display: grid; place-items: center; cursor: pointer; flex: none; }
.play svg { width: 16px; height: 16px; }
.clock { display: grid; gap: 1px; min-width: 0; flex: 1; }
.clock .time { font-size: 22px; font-weight: 700; line-height: 1; letter-spacing: 0.01em; display: flex; align-items: center; gap: 8px; }
.clock .orb { width: 14px; height: 14px; border-radius: 999px; flex: none; }
.clock .orb.sun { background: var(--sun-disc); box-shadow: 0 0 0 3px var(--sun-glow); }
.clock .orb.moon { background: transparent; box-shadow: inset -4px 2px 0 0 var(--moon-disc); }
.clock .phase { font-size: 12px; color: var(--hud-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg { display: flex; padding: 2px; border-radius: 10px; background: var(--hud-chip); flex: none; }
.seg button { height: 30px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; cursor: pointer; font-size: 12px; color: var(--hud-muted); }
.seg button[aria-pressed="true"] { background: var(--hud-bg); color: var(--hud-ink); font-weight: 700; }
.dock .bottom { display: flex; align-items: center; gap: 10px; }
.scrub { flex: 1; height: 22px; margin: 0; border-radius: 999px; -webkit-appearance: none; appearance: none; border: 1px solid var(--hud-line); cursor: pointer; }
.scrub::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 999px; background: var(--hud-bg); border: 2px solid var(--hud-ink); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25); }
.scrub::-moz-range-thumb { width: 18px; height: 18px; border-radius: 999px; background: var(--hud-bg); border: 2px solid var(--hud-ink); }
.mini { height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--hud-line); background: transparent; cursor: pointer; font-size: 12px; color: var(--hud-muted); flex: none; }
.mini[aria-pressed="true"] { color: var(--hud-ink); border-color: var(--hud-accent); }
.legend { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 11px; color: var(--hud-muted); line-height: 1; min-height: 16px; }
.legend .bar { display: inline-block; width: 22px; border-radius: 999px; background: var(--flow-neutral); vertical-align: middle; }
.legend .item { display: inline-flex; align-items: center; gap: 4px; }
.legend .dotk { width: 6px; height: 6px; border-radius: 999px; background: var(--flow-neutral); box-shadow: 0 0 0 2px var(--hud-chip); }
.legend .sep { width: 1px; height: 10px; background: var(--hud-line); }

/* 下方：行政區小卡、流向小卡、通勤結果（取代時間軸位置） */
.sheet { left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); max-width: 640px; margin: 0 auto;
  max-height: 34vh; overflow: auto; padding: 12px 14px 14px; display: grid; gap: 10px; }
.sheet header { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; }
.sheet header .sub { order: 3; flex-basis: 100%; }
.sheet h2 { margin: 0; font-size: 18px; }
.sheet .sub { font-size: 12px; color: var(--hud-muted); }
.sheet .close { margin-left: auto; width: 32px; height: 32px; border-radius: 999px; border: 1px solid var(--hud-line); background: transparent; cursor: pointer; display: grid; place-items: center; flex: none; }
.sheet .close svg { width: 14px; height: 14px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.cols h3 { margin: 0 0 6px; font-size: 12px; font-weight: 500; color: var(--hud-muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 999px; display: inline-block; }
.rank { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.rank button { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; text-align: left; padding: 6px 8px; border-radius: 8px; border: 0; background: var(--hud-chip); cursor: pointer; }
.rank .n { font-size: 14px; font-weight: 500; }
.rank .v { font-size: 13px; }
.rank .s { grid-column: 1 / -1; height: 3px; border-radius: 999px; background: var(--hud-line); overflow: hidden; }
.rank .s i { display: block; height: 100%; }
.note { margin: 0; font-size: 11px; color: var(--hud-muted); line-height: 1.5; }
.big { display: flex; align-items: baseline; gap: 8px; }
.big b { font-size: 40px; line-height: 1; }
.big span { font-size: 14px; }

/* 車站小卡 */
.lchips { display: flex; gap: 4px 10px; flex-wrap: wrap; order: 4; flex-basis: 100%; }
.lchip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--hud-muted); }
.lchip i { width: 10px; height: 4px; border-radius: 999px; }
.stat3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.stat3 div { background: var(--hud-chip); border-radius: 10px; padding: 6px 8px; display: grid; gap: 2px; }
.stat3 b { font-size: 17px; line-height: 1.1; }
.stat3 span { font-size: 11px; color: var(--hud-muted); }
.spark { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; align-items: end; height: 38px; }
.spark button { height: 100%; padding: 0; border: 0; background: transparent; display: flex; align-items: flex-end; cursor: pointer; }
.spark button i { display: block; width: 100%; min-height: 2px; border-radius: 2px 2px 0 0; background: var(--hud-line); }
.spark button[aria-current="true"] i { background: var(--hud-accent); }

// ───────────────────────── 資料 ─────────────────────────
// 原型直接讀網站的資料契約（AD-1）；疊圖（捷運路線、河川、綠地、班距）是原型自帶的 layers.json，由 tools/build_layers.py 產生，正式版改由管線輸出。
const MONTH = '2026-09';
const BASE = location.pathname.includes('/design/prototypes/')
  ? new URL(`../../../web/public/data/${MONTH}/`, location.href)
  : new URL(`data/${MONTH}/`, location.href);
const LAYERS_URL = new URL('layers.json', location.href);
let DATA = null;

async function loadData() {
  if (DATA) return DATA;
  const get = (u) => fetch(u).then((r) => { if (!r.ok) throw new Error(String(u).split('/').pop()); return r.json(); });
  const [districts, flows, stations, layers] = await Promise.all([
    get(new URL('districts.json', BASE)), get(new URL('district-flows.json', BASE)), get(new URL('stations.json', BASE)),
    get(LAYERS_URL).catch(() => null),
  ]);
  const byId = new Map(districts.districts.map((d) => [d.id, d]));
  const D = flows.districts.map((id, i) => ({ i, id, ...byId.get(id) }));
  const dIndex = new Map(D.map((d) => [d.id, d.i]));
  const S = stations.stations.map((s, i) => ({ i, ...s, di: dIndex.get(s.district), lines: layers?.stationLines?.[s.id] || [] }));
  // 每區、每站每小時的真實進出人數（站層級總量，不受少於 10 人限制，AD-3）
  const act = {}, ent = {}, ext = {}, stAct = {};
  for (const day of ['weekday', 'holiday']) {
    act[day] = []; ent[day] = []; ext[day] = []; stAct[day] = [];
    for (let h = 0; h < 24; h++) {
      const a = new Array(D.length).fill(0), e = new Array(D.length).fill(0), x = new Array(D.length).fill(0), sa = new Array(S.length).fill(0);
      for (const s of S) {
        const en = s[day].entries[h] || 0, ex = s[day].exits[h] || 0;
        sa[s.i] = en + ex;
        if (s.di === undefined) continue;
        e[s.di] += en; x[s.di] += ex; a[s.di] += en + ex;
      }
      act[day].push(a); ent[day].push(e); ext[day].push(x); stAct[day].push(sa);
    }
  }
  let maxAct = 1, maxFlow = 1, maxSt = 1;
  for (const day of ['weekday', 'holiday']) for (let h = 0; h < 24; h++) {
    for (const v of act[day][h]) maxAct = Math.max(maxAct, v);
    for (const v of stAct[day][h]) maxSt = Math.max(maxSt, v);
    const M = flows[day][h]; if (!M) continue;
    M.forEach((row, i) => row.forEach((v, j) => { if (i !== j && v) maxFlow = Math.max(maxFlow, v); }));
  }
  const dayTotal = D.map((_, i) => act.weekday.reduce((s, a) => s + a[i], 0));
  const stDay = S.map((_, i) => stAct.weekday.reduce((s, a) => s + a[i], 0));
  // 投影：以這 21 區的範圍定原點與比例（AD-12 的 project()；正式版常數寫死在 projection.ts）
  let lo0 = Infinity, lo1 = -Infinity, la0 = Infinity, la1 = -Infinity;
  for (const d of D) for (const poly of d.polygon) for (const ring of poly) for (const [lo, la] of ring) {
    lo0 = Math.min(lo0, lo); lo1 = Math.max(lo1, lo); la0 = Math.min(la0, la); la1 = Math.max(la1, la);
  }
  const lon0 = (lo0 + lo1) / 2, lat0 = (la0 + la1) / 2, kx = Math.cos(lat0 * Math.PI / 180);
  const scale = 100 / Math.max((lo1 - lo0) * kx, la1 - la0);
  const project = (lon, lat) => [(lon - lon0) * kx * scale, -(lat - lat0) * scale];
  DATA = { D, S, flows, layers, act, ent, ext, stAct, maxAct, maxFlow, maxSt, dayTotal, stDay, project, extent: [(lo1 - lo0) * kx * scale, (la1 - la0) * scale] };
  return DATA;
}

};

const fract = (v) => v - Math.floor(v);
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

const RISE = 5.7, SET = 18.0;
function sunState(h) {
  const t = (h - RISE) / (SET - RISE);
  const elev = Math.sin(Math.PI * t);
  const az = Math.PI * clamp(t, 0, 1);                     // 0＝東、π/2＝南、π＝西
  const day = smooth(-0.08, 0.32, elev);
  const night = 1 - smooth(-0.3, 0.06, elev);
  const golden = clamp(1 - Math.abs(elev - 0.1) / 0.3, 0, 1) * (elev > -0.15 ? 1 : 0);
  const twilight = clamp(1 - Math.abs(elev) / 0.32, 0, 1);
  const tn = fract((h - SET) / (24 - (SET - RISE)));
  return { t, elev, az, day, night, golden, twilight, tn, isDay: elev > 0 };
}

function makeTokens() {
  const cs = getComputedStyle(document.documentElement);
  const cache = new Map();
  const raw = (name) => cs.getPropertyValue(name).trim();
  const color = (name) => {
    if (!cache.has(name)) { const v = raw(name); cache.set(name, v && !v.startsWith('rgba') ? new THREE.Color(v) : null); }
    return cache.get(name);
  };
  const KEYS = [[0, 'night'], [4.8, 'night'], [5.7, 'dawn'], [6.6, 'dawn'], [7.6, 'day'], [16.6, 'day'], [17.6, 'dusk'], [18.4, 'dusk'], [19.3, 'night'], [24, 'night']];
  const at = (name, h, out = new THREE.Color()) => {
    const plain = color(`--${name}`);
    let k = 0; while (k < KEYS.length - 2 && h >= KEYS[k + 1][0]) k++;
    const [h0, p0] = KEYS[k], [h1, p1] = KEYS[k + 1];
    const c0 = color(`--${name}-${p0}`) || plain, c1 = color(`--${name}-${p1}`) || plain;
    if (!c0) return out.set(0, 0, 0);
    return out.copy(c0).lerp(c1 || c0, clamp((h - h0) / (h1 - h0), 0, 1));
  };
  return { color: (n) => (color(n) || new THREE.Color()).clone(), at, css: (n) => raw(n) };
}

function hourTitle(data, day, h) {

}

      <div class="legend" aria-label="流向圖例"></div>
    </section>
    <section class="hud sheet" hidden aria-live="polite"></section>`;
  stage.appendChild(root);
  const $ = (s) => root.querySelector(s);
  const canvas = $('canvas.scene');

  let api = null;
  loadData().then((data) => { if (!disposed) api = build(data); })
    .catch((err) => { $('.loading').textContent = `資料載入失敗：${err.message}。請從 repo 根目錄起本機伺服器再開這頁。`; });

  function build(data) {
    $('.loading').remove();
    const T = makeTokens();
    const { D, S: ST, flows, project } = data;
    const LY = data.layers?.districts || {};
    const narrowNow = () => innerWidth / innerHeight < 0.8;

    // ── renderer、相機 ──
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = V.tone;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(38, 1, 0.5, 900);
    const controls = new CameraControls(camera, canvas);
    controls.minDistance = 18; controls.maxDistance = 260; controls.maxPolarAngle = 1.32; controls.smoothTime = 0.35;
    const HOME = () => {
      const narrow = narrowNow();
      const d = (narrow ? 208 : 172) * (V.cam === 'low' ? 0.92 : 1);
      const [py, pz] = V.cam === 'low' ? [0.5, 0.87] : [0.64, 0.76];
      return [0, d * py, d * pz, 0, 0, narrow ? 12 : 6];
    };
    controls.setLookAt(...HOME(), false);
    // 看某一點：手機上把目標往鏡頭方向偏，讓主體落在下方小卡之上
    const lookAt = (x, z, d, smoothOn = !S.still) => {
      const narrow = narrowNow(), dd = d * (narrow ? 1.4 : 1), tz = z + dd * (narrow ? 0.2 : 0.08);
      const [py, pz] = V.cam === 'low' ? [0.56, 0.8] : [0.72, 0.7];
      controls.setLookAt(x, dd * py, tz + dd * pz, x, 0, tz, smoothOn);
    };

    // ── 後製：B 調色、C 移軸 ──
    let composer = null, bloom = null, grade = null, hTilt = null, vTilt = null;
    if (V.grade || V.tilt || V.bloom) {
      composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));
      bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), 0, 0.5, 0.78);
      composer.addPass(bloom);
      composer.addPass(new OutputPass());
      if (V.grade) {
        grade = new ShaderPass({
          uniforms: { tDiffuse: { value: null }, uLift: { value: new THREE.Color() }, uGain: { value: new THREE.Color(1, 1, 1) }, uSat: { value: 1 }, uVig: { value: 0.3 } },
          vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
          fragmentShader: `uniform sampler2D tDiffuse; uniform vec3 uLift; uniform vec3 uGain; uniform float uSat; uniform float uVig; varying vec2 vUv;
            void main(){
              vec4 src = texture2D(tDiffuse, vUv);
              vec3 c = src.rgb;
              c = uGain * (c + uLift * 0.16 * (1.0 - c));
              float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
              c = mix(vec3(l), c, uSat);
              float d = distance(vUv, vec2(0.5));

      if (V.tilt) {

        hTilt.uniforms.r.value = vTilt.uniforms.r.value = 0.5;

      }
    }

    // ── 光：太陽（白天）／月亮（夜裡）共用一盞會投影的平行光，加天空半球光 ──
    const hemi = new THREE.HemisphereLight(0xffffff, 0xffffff, 1);
    const sun = new THREE.DirectionalLight(0xffffff, 1.5);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    Object.assign(sun.shadow.camera, { left: -78, right: 78, top: 78, bottom: -78, near: 1, far: 420 });
    sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.03; sun.shadow.radius = V.shadowRadius;
    sun.shadow.camera.updateProjectionMatrix();
    scene.add(hemi, sun, sun.target);

    let ramp = null;
    if (V.toon) {
      ramp = new THREE.DataTexture(new Uint8Array([90, 170, 255]), 3, 1, THREE.RedFormat);
      ramp.minFilter = ramp.magFilter = THREE.NearestFilter; ramp.needsUpdate = true;
    }
    const surf = (opts = {}, rough = 0.9) => V.toon
      ? new THREE.MeshToonMaterial({ gradientMap: ramp, ...Object.fromEntries(Object.entries(opts).filter(([k]) => k !== 'flatShading')) })
      : new THREE.MeshStandardMaterial({ roughness: rough, metalness: 0, ...opts });
    const phased = [];   // [material, 'color'|'emissive', token]
    const tok = (m, token, prop = 'color') => { phased.push([m, prop, token]); return m; };

    // 窗戶：用世界座標畫，樓層大小一致、不會因為建築被拉高而變形；白天是較深的玻璃，入夜依比例亮燈
    const WIN = { lit: { value: 0.5 } };
    const withWindows = (m) => {
      m.onBeforeCompile = (sh) => {
        sh.uniforms.uLit = WIN.lit;
        sh.vertexShader = sh.vertexShader
          .replace('#include <common>', '#include <common>\nvarying vec3 vCbW;\nvarying vec3 vCbN;')
          .replace('#include <project_vertex>', `#include <project_vertex>
            #ifdef USE_INSTANCING
              vCbW = (modelMatrix * instanceMatrix * vec4(transformed, 1.0)).xyz;
              vCbN = normalize(mat3(modelMatrix * instanceMatrix) * objectNormal);

        sh.fragmentShader = sh.fragmentShader
          .replace('#include <common>', '#include <common>\nvarying vec3 vCbW;\nvarying vec3 vCbN;\nuniform float uLit;')
          .replace('#include <color_fragment>', `#include <color_fragment>
            float cbSide = 1.0 - step(0.55, abs(vCbN.y));
            vec2 cbT = normalize(vec2(-vCbN.z, vCbN.x) + vec2(1e-4));
            float cbU = dot(vCbW.xz, cbT) / 0.17, cbV = vCbW.y / 0.22;
            float cbWin = cbSide * step(0.3, fract(cbU)) * step(fract(cbU), 0.72) * step(0.32, fract(cbV)) * step(fract(cbV), 0.8);
            float cbLit = step(fract(sin(dot(vec3(floor(cbU), floor(cbV), floor(dot(vCbW.xz, vec2(0.37, 0.71)))), vec3(12.9898, 78.233, 37.719))) * 43758.5453), uLit);
            diffuseColor.rgb *= 1.0 - 0.16 * cbWin;`)
          .replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\n            totalEmissiveRadiance *= cbWin * cbLit;');
      };
      return m;
    };

    // ── 沙盤底座：三層「地層」蛋糕，頂面有細刻度 ──
    const [ex, ez] = data.extent;
    const PW = ex + 16, PD = ez + 16;
    const rr = (w, h, r) => { const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
      s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + h - r);
      s.quadraticCurveTo(x + w, y + h, x + w - r, y + h); s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
      s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y); return s; };
    const slab = (inset, t, top, topTok, sideTok) => {
      const g = new THREE.ExtrudeGeometry(rr(PW - inset, PD - inset, 5), { depth: t, bevelEnabled: true, bevelThickness: 0.5, bevelSize: 0.5, bevelSegments: 3, curveSegments: 10 });
      g.rotateX(-Math.PI / 2); g.translate(0, top - t - 0.5, 0);
      const m = new THREE.Mesh(g, [tok(surf(), topTok), tok(surf(), sideTok)]); m.receiveShadow = true; scene.add(m);
    };
    slab(0, 1.4, 0, 'plinth', 'plinth-side');
    slab(0.6, 1.8, -2.4, 'strata-1', 'strata-1');
    slab(1.4, 1.6, -4.7, 'strata-2', 'strata-2');
    const PT = 6.8;
    {
      const cv = document.createElement('canvas'); cv.width = cv.height = 512; const c2 = cv.getContext('2d');
      c2.strokeStyle = T.css('--plinth-line'); c2.globalAlpha = 0.6; c2.lineWidth = 1;
      for (let i = 0; i <= 512; i += 32) { c2.beginPath(); c2.moveTo(i, 0); c2.lineTo(i, 512); c2.stroke(); c2.beginPath(); c2.moveTo(0, i); c2.lineTo(512, i); c2.stroke(); }
      const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
      const grid = new THREE.Mesh(new THREE.PlaneGeometry(PW - 2, PD - 2), new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 0.22, depthWrite: false }));
      grid.rotation.x = -Math.PI / 2; grid.position.y = 0.02; grid.renderOrder = 1; scene.add(grid);
    }
    const blob = (() => {
      const cv = document.createElement('canvas'); cv.width = cv.height = 128; const g = cv.getContext('2d');
      const gr = g.createRadialGradient(64, 64, 10, 64, 64, 64); gr.addColorStop(0, '#fff'); gr.addColorStop(1, '#000');
      g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
      const m = new THREE.Mesh(new THREE.PlaneGeometry(PW * 1.5, PD * 1.5), new THREE.MeshBasicMaterial({ color: T.color('--shadow'), alphaMap: new THREE.CanvasTexture(cv), transparent: true, depthWrite: false, opacity: 0.4 }));
      m.rotation.x = -Math.PI / 2; m.position.y = -PT - 2; scene.add(m); return m;
    })();

    // ── 行政區：薄地塊＋這區的河川、綠地、路線、街廓、樹、地標都在同一個 group，點選時一起彈起 ──
    const TILE_TOP = 1.16;
    const inside = (p, poly) => { let c = false; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const a = poly[i], b = poly[j]; if ((a.y > p.y) !== (b.y > p.y) && p.x < (b.x - a.x) * (p.y - a.y) / (b.y - a.y) + a.x) c = !c; } return c; };
    const toV2 = (ring) => ring.map(([lo, la]) => { const [x, z] = project(lo, la); return new THREE.Vector2(x, -z); });
    const shapeOf = (poly) => { const s = new THREE.Shape(toV2(poly[0])); for (const h of poly.slice(1)) s.holes.push(new THREE.Path(toV2(h))); return s; };
    const stPos = ST.map((s) => project(+s.lon, +s.lat));
    const maxStDay = Math.max(...data.stDay);
    const stW = ST.map((s) => Math.sqrt(data.stDay[s.i] / maxStDay));
    const lmPos = LANDMARKS.map((l) => project(l.lon, l.lat));
    // 共用幾何
    // 圓角只切一段（每棟約 100 個三角形）：夠圓潤、手機也撐得住上千棟
    const bGeo = new RoundedBoxGeometry(1, 1, 1, 1, 0.07); bGeo.translate(0, 0.5, 0);
    const crownGeo = new RoundedBoxGeometry(1, 1, 1, 1, 0.12); crownGeo.translate(0, 0.5, 0);
    const crownTop = new THREE.IcosahedronGeometry(0.5, 0); crownTop.translate(0, 0.42, 0);
    const trunkGeo = new THREE.CylinderGeometry(0.05, 0.07, 0.34, 6); trunkGeo.translate(0, 0.17, 0);
    // 0–2：牆色（白、米、淺灰藍）；3–5：屋頂小塔的點綴色（磚紅、灰綠、沙金），只出現在較高的樓上
    const tints = ['--bld-tint-1', '--bld-tint-2', '--bld-tint-3', '--accent-1', '--accent-2', '--accent-3'].map((t) => T.color(t));
    const treeTints = ['--tree-tint-1', '--tree-tint-2'].map((t) => T.color(t));
    const CELL = 1.05, SIG = 1.5, rnd = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();

    const DIST = D.map((d) => {
      const [cx, cz] = project(...d.centroid);
      const group = new THREE.Group(); scene.add(group);
      const shapes = d.polygon.map((poly) => {
        const ring = (r) => r.map(([lo, la]) => { const [x, z] = project(lo, la); return new THREE.Vector2(cx + (x - cx) * 0.992, -(cz + (z - cz) * 0.992)); });
        const sh = new THREE.Shape(ring(poly[0])); for (const hole of poly.slice(1)) sh.holes.push(new THREE.Path(ring(hole))); return sh;
      });
      const geo = new THREE.ExtrudeGeometry(shapes, { depth: 1, bevelEnabled: true, bevelThickness: 0.08, bevelSize: 0.1, bevelSegments: 2, curveSegments: 2 });
      geo.rotateX(-Math.PI / 2); geo.translate(0, 0.08, 0);
      const mats = [];
      const M = (m) => { mats.push(m); return m; };
      const mesh = new THREE.Mesh(geo, [M(tok(surf(), 'tile')), M(tok(surf(), 'tile-side'))]); mesh.castShadow = true; mesh.receiveShadow = true; mesh.userData.di = d.i;
      group.add(mesh);
      const L = LY[d.id] || { water: [], green: [], rail: [] };
      const flat = (polys, token, y, off, rough) => {
        if (!polys.length) return null;
        const g = new THREE.ShapeGeometry(polys.map(shapeOf), 1); g.rotateX(-Math.PI / 2); g.translate(0, y, 0);
        const m = M(tok(surf({ polygonOffset: true, polygonOffsetFactor: off, polygonOffsetUnits: off }, rough), token));
        const ms = new THREE.Mesh(g, m); ms.receiveShadow = true; group.add(ms); return ms;
      };
      const water = flat(L.water, 'water', TILE_TOP + 0.004, -2, 0.35);
      const green = flat(L.green, 'green', TILE_TOP + 0.008, -3, 0.95);
      let rail = null;
      if (L.rail.length) {
        const pos = [], col = [], c = new THREE.Color();
        for (const r of L.rail) {
          c.copy(T.color(lineToken(r.line)));
          for (let k = 0; k < r.coords.length - 1; k++) {
            const [x0, z0] = project(...r.coords[k]), [x1, z1] = project(...r.coords[k + 1]);
            pos.push(x0, TILE_TOP + 0.09, z0, x1, TILE_TOP + 0.09, z1); col.push(c.r, c.g, c.b, c.r, c.g, c.b);
          }
        }
        const g = new LineSegmentsGeometry(); g.setPositions(pos); g.setColors(col);
        rail = new LineSegments2(g, new LineMaterial({ vertexColors: true, linewidth: 0.3, worldUnits: true, transparent: true, opacity: 1 })); group.add(rail);
      }

      // 街廓（示意）：整座城共用一張 1.05 單位的方格，每格依附近車站的全日人數算「密度」，
      // 密的地方蓋高、疏的地方蓋矮，太疏就種樹；車站周圍留廣場，地標周圍留空地，河上不蓋
      const outer = shapes[0].getPoints(), bb = new THREE.Box2().setFromPoints(outer);
      const waterRings = L.water.map((p) => toV2(p[0])), greenRings = L.green.map((p) => toV2(p[0]));
      const blds = [], crowns = [], trees = [];
      for (let gx = Math.floor(bb.min.x / CELL); gx <= Math.ceil(bb.max.x / CELL); gx++) {
        for (let gy = Math.floor(bb.min.y / CELL); gy <= Math.ceil(bb.max.y / CELL); gy++) {
          const x = (gx + 0.5) * CELL, z = -(gy + 0.5) * CELL, p = new THREE.Vector2(x, -z);
          if (!inside(p, outer) || waterRings.some((w) => inside(p, w))) continue;
          let score = 0, near = Infinity;
          for (let k = 0; k < ST.length; k++) {
            const dx = x - stPos[k][0], dz = z - stPos[k][1], dd = dx * dx + dz * dz;
            if (dd < near) near = dd;
            if (dd < 36 * SIG * SIG) score += stW[k] * Math.exp(-dd / (2 * SIG * SIG));
          }
          near = Math.sqrt(near);
          const lmNear = lmPos.some(([lx, lz]) => Math.hypot(x - lx, z - lz) < 1.5);
          if (greenRings.some((w) => inside(p, w))) { if (rnd() < 0.85) trees.push([x + (rnd() - 0.5) * 0.5, z + (rnd() - 0.5) * 0.5, 0.8 + rnd() * 0.5]); continue; }
          if (near < 0.55 || lmNear) continue;
          // 每 4 格留一條大街，城市才有街廓的節奏，不是一整片方塊地毯
          const avenue = ((gx % 4) + 4) % 4 === 0 || ((gy % 4) + 4) % 4 === 0;
          if (avenue && !(score < 0.03 && near > 2.4)) continue;   // 山區不留大街，照常種樹
          if (score > 0.11 + rnd() * 0.05) {
            const h = 0.28 + 1.3 * Math.pow(Math.min(1, score), 0.8) * (0.75 + 0.5 * rnd());   // 矮胖的積木比細高的針好看：最高約 1.8，寬高比 ≤ 2.5
            const w = CELL * (0.58 + 0.2 * rnd()), dpt = CELL * (0.58 + 0.2 * rnd());
            const tint = h > 1.3 ? 2 : rnd() < 0.55 ? 0 : 1;
            blds.push([x + (rnd() - 0.5) * 0.1, z + (rnd() - 0.5) * 0.1, w, h, dpt, tint]);
            if (h > 1.05 && rnd() < 0.6) crowns.push([x, z, w * 0.6, 0.18 + h * 0.15, dpt * 0.6, h, 3 + Math.floor(rnd() * 3)]);
          } else if (score < 0.03 && near > 2.4) {
            // 山區只種成片的小樹林（低頻波紋決定哪裡成林），不要滿地均勻撒點
            const grove = Math.sin(x * 0.33) + Math.sin(z * 0.27 + 1.3) + Math.sin((x + z) * 0.19 + 0.7);
            if (grove > 1.35 && rnd() < 0.55) trees.push([x + (rnd() - 0.5) * 0.6, z + (rnd() - 0.5) * 0.6, 1.0 + rnd() * 0.6]);
          }
        }
      }
      const dummy = new THREE.Object3D(), c = new THREE.Color();
      const wall = M(withWindows(tok(tok(surf({ emissive: 0xffffff, emissiveIntensity: 0 }, 0.8), 'building'), 'window', 'emissive')));
      const roof = M(tok(surf({}, 0.85), 'roof'));
      const mk = (geoX, list, place) => {
        const im = new THREE.InstancedMesh(geoX, [wall, wall, roof, roof, wall, wall], Math.max(1, list.length)); im.castShadow = true; im.receiveShadow = true;
        list.forEach((b, k) => { place(b); dummy.updateMatrix(); im.setMatrixAt(k, dummy.matrix); im.setColorAt(k, tints[b[b.length - 1]]); });
        im.count = list.length; im.position.y = TILE_TOP; group.add(im); return im;
      };
      dummy.rotation.set(0, 0, 0);
      const bld = mk(bGeo, blds, ([x, z, w, h, dp]) => { dummy.position.set(x, 0, z); dummy.scale.set(w, h, dp); });
      const crown = mk(crownGeo, crowns, ([x, z, w, h, dp, base]) => { dummy.position.set(x, base - 0.02, z); dummy.scale.set(w, h, dp); });
      // 樹：低多邊形樹冠＋細樹幹，兩種綠
      const treeMat = M(tok(surf({ flatShading: true }, 0.95), 'tree')), trunkMat = M(tok(surf(), 'plinth-side'));
      const crownsT = new THREE.InstancedMesh(crownTop, treeMat, Math.max(1, trees.length)), trunks = new THREE.InstancedMesh(trunkGeo, trunkMat, Math.max(1, trees.length));
      trees.forEach(([x, z, s], k) => {
        dummy.position.set(x, 0, z); dummy.scale.set(s * 0.7, s * (0.8 + rnd() * 0.4), s * 0.7); dummy.rotation.y = rnd() * 3; dummy.updateMatrix();
        crownsT.setMatrixAt(k, dummy.matrix); crownsT.setColorAt(k, treeTints[k % 2]);
        dummy.scale.setScalar(s); dummy.updateMatrix(); trunks.setMatrixAt(k, dummy.matrix);
      });
      dummy.rotation.set(0, 0, 0);
      crownsT.count = trunks.count = trees.length;
      const treeGroup = new THREE.Group(); treeGroup.add(crownsT, trunks); crownsT.castShadow = trunks.castShadow = true; crownsT.receiveShadow = true;
      treeGroup.position.y = TILE_TOP; group.add(treeGroup);
      return { d, group, mesh, mats, water, green, rail, bld, crown, treeGroup, wall, cx, cz, lift: 0, liftTo: 0, fade: 1, rise: reduced ? 1 : 0, press: 1, nB: blds.length };
    });
    const dById = new Map(DIST.map((x) => [x.d.id, x]));

    // ── 地標（示意）：用幾個積木拼出輪廓，放在所在行政區的 group 裡 ──
    LANDMARKS.forEach((l, k) => {
      const x = dById.get(l.district); if (!x) return;
      const [lx, lz] = lmPos[k]; const g = new THREE.Group(); g.position.set(lx, TILE_TOP, lz);
      const part = (geom, token, y, sx = 1, sy = 1, sz = 1, emissive) => {
        const m = x.mats[x.mats.push(tok(surf({}, 0.6), token)) - 1];
        if (emissive) { m.emissive = new THREE.Color(); tok(m, 'window', 'emissive'); m.userData.glow = true; }
        const ms = new THREE.Mesh(geom, m); ms.position.y = y; ms.scale.set(sx, sy, sz); ms.castShadow = true; ms.receiveShadow = true; g.add(ms); return ms;
      };
      if (l.kind === 'tower') {
        part(new RoundedBoxGeometry(1.5, 1.0, 1.5, 2, 0.1), 'lm-glass', 0.5, 1, 1, 1, true);
        const seg = new THREE.CylinderGeometry(0.62, 0.46, 0.62, 4); seg.rotateY(Math.PI / 4);
        for (let i = 0; i < 8; i++) part(seg, 'lm-glass', 1.3 + i * 0.64, 1, 1, 1, true);
        part(new THREE.CylinderGeometry(0.2, 0.32, 0.8, 4).rotateY(Math.PI / 4), 'lm-glass', 6.8);

      const dl = c.day === 'weekday' ? '平日' : '假日';
      const big = c.v ? `<b class="num" data-count="${c.v}">0</b><span>人跟你同一小時出發、同一站下車</span>` : '<b>少於 10 人</b><span>跟你同路</span>';
      showSheet(`<header><h2>${esc(o.display)} → ${esc(d.display)}</h2><span class="sub">${dl} ${c.h} 點出發</span><button class="close" aria-label="關閉">${ICON.close}</button></header>
        <div class="big">${big}</div>
        <p class="note">${c.rank ? `在 ${esc(o.display)} ${c.h} 點出發的人裡，${esc(d.display)} 是第 ${c.rank} 熱門的目的地（共 ${c.total} 個方向有公開人數）。` : ''}這一小時從 ${esc(o.display)} 出發的共 <span class="num">${fmt(c.dep)}</span> 人。${MONTH.replace('-', ' 年 ')} 月${dl}平均，資料：臺北捷運公司 OD 開放資料。</p>`);
      const el = sheet.querySelector('[data-count]');
      if (el) {
        if (S.still) el.textContent = fmt(c.v);
        else { const o2 = { n: 0 }; tw(gsap.to(o2, { n: c.v, duration: 0.9, ease: 'power3.out', onUpdate: () => { el.textContent = fmt(o2.n); } })); }
      }
    }

    // ── 浮在選中區上方的名牌 ──
    const badge = $('.badge');
    function updateBadge() {
      if (S.sel < 0 || S.commute) { badge.hidden = true; return; }
      const x = DIST[S.sel]; P.set(x.cx, topOf(S.sel) + 4.2, x.cz).project(camera);
      if (P.z > 1) { badge.hidden = true; return; }
      const wasHidden = badge.hidden; badge.hidden = false;
      const html = `<b>${esc(x.d.name)}</b><span>${esc(titleOf(S.sel).replace(/（.*）/, ''))}</span>`;
      if (badge.dataset.html !== html) { badge.innerHTML = html; badge.dataset.html = html; }
      if (wasHidden && !S.still) tw(gsap.fromTo(badge, { scale: 0.7 }, { scale: 1, duration: 0.45, ease: 'back.out(2.2)' }));
      badge.style.left = `${(P.x * 0.5 + 0.5) * innerWidth}px`; badge.style.top = `${(-P.y * 0.5 + 0.5) * innerHeight}px`;
    }

    // ── 天空 ──
    const sky = $('.sky'), sunEl = $('.sky .sun'), moonEl = $('.sky .moon'), starsEl = $('.sky .stars');
    starsEl.innerHTML = Array.from({ length: 70 }, () => `<i style="left:${(Math.random() * 100).toFixed(2)}%;top:${(Math.random() * 42).toFixed(2)}%;opacity:${(0.35 + Math.random() * 0.65).toFixed(2)}"></i>`).join('');
    const skyTop = new THREE.Color(), skyHor = new THREE.Color(), skyLow = new THREE.Color();
    function updateSky(h, s) {
      T.at('sky-top', h, skyTop); T.at('sky-horizon', h, skyHor);
      P.set(0, 0, -PD / 2).project(camera);
      const horizon = clamp((-P.y * 0.5 + 0.5) * innerHeight, 80, innerHeight * 0.6);
      skyLow.copy(skyHor).lerp(hemi.groundColor, 0.45);
      sky.style.background = `linear-gradient(180deg, #${skyTop.getHexString()} 0px, #${skyHor.getHexString()} ${horizon.toFixed(0)}px, #${skyLow.getHexString()} 100%)`;
      const arcH = Math.max(40, horizon - 70);
      const sx = 88 - 76 * clamp(s.t, -0.05, 1.05), sy = horizon - Math.sin(Math.PI * clamp(s.t, 0, 1)) * arcH * 0.85 + (s.elev < 0 ? -s.elev * 60 : 0);
      sunEl.style.transform = `translate(${(sx / 100 * innerWidth).toFixed(1)}px, ${sy.toFixed(1)}px)`;
      sunEl.style.opacity = String(smooth(-0.12, 0.05, s.elev));
      const mx = 88 - 76 * s.tn, my = horizon - Math.sin(Math.PI * s.tn) * arcH * 0.7;
      moonEl.style.transform = `translate(${(mx / 100 * innerWidth).toFixed(1)}px, ${my.toFixed(1)}px)`;
      moonEl.style.opacity = String(s.night);
      starsEl.style.opacity = String(s.night * 0.9);
      document.documentElement.dataset.phase = s.night > 0.55 ? 'night' : 'day';
    }

    function resize() {
      const w = innerWidth, h = innerHeight;
      renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
      composer?.setSize(w, h); bloom?.setSize(w * 0.5, h * 0.5);
      if (hTilt) { hTilt.uniforms.h.value = 3.2 / w; vTilt.uniforms.v.value = 3.2 / h; }
      DIST.forEach((x) => x.rail?.material.resolution.set(w, h));
    }
    on(window, 'resize', resize); resize();

    function rebuildIfNeeded(force = false) {
      const hh = Math.floor(S.hour) % 24;
      const ctx = `${S.day}|${S.sel}|${S.station}|${!!stationRow}|${S.focusArc}|${S.commute?.arc.key}|${S.still}|${layerState.flow}`;
      const sig = `${ctx}|${hh}`;
      if (force || sig !== arcSig) { const animate = ctx !== ctxSig; arcSig = sig; ctxSig = ctx; rebuildArcs(animate); }
    }
    applyLayers();
    if (new URLSearchParams(location.search).has('debug')) { window.__cb = { S, controls, get arcs() { return arcs; } }; gsap.ticker.lagSmoothing(0); }   // 測試用：無頭瀏覽器很慢，關掉 lag smoothing 讓補間照實際時間跑完

    // ── 每一格 ──
    const timer = new THREE.Timer(); timer.connect(document);
    const dummy = new THREE.Object3D(), TP = {};
    let t = 0, lastHourInt = -1, frameNo = 0, trainT = 0;
    function frame() {
      raf = requestAnimationFrame(frame);
      timer.update(); const dt = Math.min(timer.getDelta(), 0.1);
      t += dt; frameNo++;
      if (S.playing && !S.still) S.hour = (S.hour + dt * 0.5 * S.speed) % 24;   // 48 秒一天
      const h = S.hour, hh = Math.floor(h) % 24, h2 = (hh + 1) % 24, f = h - Math.floor(h);
      const sunS = sunState(h);
      if (hh !== lastHourInt) {
        lastHourInt = hh;
        if (S.station >= 0 && S.shard) stationRow = S.shard[S.day][hh] || [];
        if (!S.commute && !sheet.hidden) { if (S.station >= 0) renderStationCard(S.shard || null); else if (S.sel >= 0) renderDistrictCard(); else if (S.focusArc) renderFlowCard(); }
      }
      updateClock(sunS);
      maybeToast(hourTitle(data, S.day, h));
      updateSky(h, sunS);

      if (sunS.elev > 0) {
        const e = sunS.elev * 1.1, R = 160;
        sun.position.set(Math.cos(sunS.az) * Math.cos(e) * R, Math.sin(e) * R + 8, Math.sin(sunS.az) * Math.cos(e) * R * 0.85);
        sun.intensity = V.sun * (0.38 + 0.62 * smooth(0, 0.35, sunS.elev));
      } else {
        sun.position.set(-70, 120, -60);
        sun.intensity = V.moon * sunS.night;
      }
      T.at('light', h, sun.color);
      T.at('amb-sky', h, hemi.color); T.at('amb-ground', h, hemi.groundColor);
      const lit = Math.max(sunS.day, sunS.twilight * 0.62);
      hemi.intensity = V.hemi[0] + (V.hemi[1] - V.hemi[0]) * lit;
      renderer.toneMappingExposure = V.exposure[0] + (V.exposure[1] - V.exposure[0]) * lit;
      blob.material.opacity = 0.18 + 0.3 * sunS.day;
      for (const [m, prop, token] of phased) T.at(token, h, m[prop]);
      if (bloom) { bloom.strength = V.bloom * (0.25 + 0.75 * sunS.night); bloom.enabled = bloom.strength > 0.02; }
      if (grade) {
        T.at('grade-lift', h, grade.uniforms.uLift.value); T.at('grade-gain', h, grade.uniforms.uGain.value);
        grade.uniforms.uSat.value = 1.08 + 0.14 * sunS.golden - 0.12 * sunS.night;
        grade.uniforms.uVig.value = 0.22 + 0.3 * sunS.night;
      }

      // 行政區呼吸：街廓高度＝當下（相鄰兩個整點內插）的真實進出人數；窗光入夜亮起，深夜漸少
      const A0 = data.act[S.day][hh], A1 = data.act[S.day][h2];
      const win = V.winNight * smooth(0.25, 0.9, sunS.night) + 0.15 * sunS.golden;
      WIN.lit.value = 0.62 - 0.32 * smooth(0, 4, (h + 24 - 20) % 24) * (h < 6 || h >= 20 ? 1 : 0);
      DIST.forEach((x, k) => {
        const a = A0[k] * (1 - f) + A1[k] * f;
        const idle = S.still ? 0 : Math.sin(t * 1.6 + k * 0.9) * 0.02;
        x.group.position.y = x.lift;
        x.group.scale.y = Math.max(0.03, x.rise * x.press);
        const breath = 0.7 + 0.5 * Math.sqrt(a / data.maxAct) + idle;
        x.bld.scale.y = x.crown.scale.y = Math.max(0.02, breath);
        x.wall.emissiveIntensity = win;
        for (const m of x.mats) { m.transparent = x.fade < 0.999; m.opacity = x.fade; if (m.userData.glow) m.emissiveIntensity = win * 0.6; }
        if (x.rail) x.rail.material.opacity = 0.25 + 0.75 * x.fade;
      });

      // 車站：細柱高度依此刻進出人數，站珠浮在柱頂；夜裡發光
      const SA0 = data.stAct[S.day][hh], SA1 = data.stAct[S.day][h2], SAh = new Array(ST.length);
      for (let i = 0; i < ST.length; i++) {
        const s = ST[i];
        if (s.di === undefined) { SAh[i] = 0; dummy.position.set(0, -50, 0); dummy.scale.setScalar(0.0001); dummy.updateMatrix(); stCol.setMatrixAt(i, dummy.matrix); stCap.setMatrixAt(i, dummy.matrix); stPlaza.setMatrixAt(i, dummy.matrix); continue; }
        const a = SA0[i] * (1 - f) + SA1[i] * f; SAh[i] = a;
        const base = topOf(s.di), rise = DIST[s.di].rise, chosen = i === S.station || (S.commute && (i === S.commute.o || i === S.commute.d));
        const colH = (0.35 + 2.1 * Math.sqrt(a / data.maxSt)) * rise;
        dummy.position.set(stPos[i][0], base, stPos[i][1]); dummy.scale.set(1, colH, 1); dummy.updateMatrix(); stCol.setMatrixAt(i, dummy.matrix);
        dummy.scale.setScalar(rise); dummy.updateMatrix(); stPlaza.setMatrixAt(i, dummy.matrix);
        capY[i] = base + colH + 0.2;
        const cs = (chosen ? 1.6 : 1) * stPop[i] * rise;
        dummy.position.y = capY[i]; dummy.scale.setScalar(Math.max(0.001, cs)); dummy.updateMatrix(); stCap.setMatrixAt(i, dummy.matrix);
      }
      [stCol, stCap, stPlaza].forEach((m) => { m.instanceMatrix.needsUpdate = true; });
      capMat.emissiveIntensity = 0.25 + 1.5 * sunS.night;

      // 列車（示意）：間隔＝班距（分鐘）×1.6 單位；營運時間外沒有列車
      let nT = 0;
      const showT = layerState.train && layerState.rail && !S.still;
      if (showT) {
        trainT += dt * S.speed * (S.playing ? 1 : 0.6);
        for (const tk of TR) {
          const H = headwayOf(tk.line, hh); if (!H) continue;
          const gap = H * 1.6, n = Math.max(1, Math.floor(tk.len / gap));
          for (let dir = 0; dir < 2; dir++) for (let j = 0; j < n && nT < TRAIN_CAP; j++) {
            let sPos = (j * tk.len / n + trainT * 2.4 + dir * tk.len / n / 2) % tk.len; if (dir) sPos = tk.len - sPos;
            trackAt(tk, sPos, TP);
            const off = dir ? -0.16 : 0.16, lift = TP.di >= 0 ? DIST[TP.di].group.position.y : 0, rise = TP.di >= 0 ? DIST[TP.di].rise : 1;
            dummy.position.set(TP.x - TP.dz * off, (lift + TILE_TOP) * 1 + 0.2 * rise, TP.z + TP.dx * off);
            dummy.rotation.set(0, Math.atan2(-TP.dz, TP.dx), 0); dummy.scale.setScalar(rise); dummy.updateMatrix();
            trains.setMatrixAt(nT, dummy.matrix); trains.setColorAt(nT, tk.color); nT++;
          }
        }
      }
      dummy.rotation.set(0, 0, 0);
      trains.count = nT; trains.instanceMatrix.needsUpdate = true; if (trains.instanceColor) trains.instanceColor.needsUpdate = true;
      trainMat.emissiveIntensity = 0.1 + 0.7 * sunS.night;

      // 雲：白天飄、夜裡淡出
      cloudMat.opacity = 0.85 * smooth(0.05, 0.6, lit) * smooth(95, 150, controls.distance);   // 放大看細節時雲淡出，不擋畫面
      clouds.forEach((c) => {
        c.visible = layerState.cloud && cloudMat.opacity > 0.02;
        if (!S.still) { c.position.x += c.userData.v * dt * S.speed; if (c.position.x > PW / 2 + 14) c.position.x = -PW / 2 - 14; }
      });

      rebuildIfNeeded();
      if (!S.still) chevTex.offset.x = -t * (RUSH(hh) ? 1.3 : 0.7);

      let n = 0;
      const showP = !S.still && layerState.flow;
      particles.visible = showP;
      if (showP) {
        const rush = RUSH(hh) ? 1.6 : 1, speed = 7 * rush, rate = 0.55 * rush, hi = particleHi;
        for (const a of arcs) {
          if (S.focusArc && S.focusArc !== a.key && a.kind !== 'commute') continue;
          for (let i = 0; i < a.n && n < CAP; i++) {
            const u = 0.05 + 0.9 * fract(i / a.n + t * speed / a.len + a.phase);
            if (u > 0.05 + 0.9 * a.reveal) continue;
            const pulse = Math.pow(fract(t * rate - u * 1.6 + a.phase), 3.0);
            bez(a, u, P); bezTan(a, u, TAN);
            dummy.position.set(P.x, P.y + 0.12, P.z); dummy.lookAt(P.x + TAN.x, P.y + 0.12 + TAN.y, P.z + TAN.z);
            dummy.scale.setScalar(0.75 + 0.6 * pulse); dummy.updateMatrix();
            particles.setMatrixAt(n, dummy.matrix);
            particles.setColorAt(n, tmpC.copy(a.color).lerp(hi, 0.35 + 0.65 * pulse));
            n++;
          }
        }
        dummy.rotation.set(0, 0, 0);
      }
      particles.count = n; particles.instanceMatrix.needsUpdate = true; if (particles.instanceColor) particles.instanceColor.needsUpdate = true;

      const dests = []; const seen = new Set();
      for (const a of arcs) {
        const key = a.o !== undefined ? `s${a.d}` : `d${a.to}`;
        if (seen.has(key) || (S.focusArc && S.focusArc !== a.key && a.kind !== 'commute')) continue;
        seen.add(key); dests.push(a);
      }
      rings.forEach((r, k) => {
        const a = dests[k];
        if (!a || S.still || a.reveal < 1) { r.visible = false; return; }
        const rf = fract(t * 0.55 * (RUSH(hh) ? 1.6 : 1) + a.phase);
        r.visible = true; r.position.set(a.p2.x, a.p2.y - 0.2, a.p2.z);
        r.scale.setScalar(0.6 + rf * (2.5 + a.w * 2.2)); r.material.opacity = (1 - rf) * (1 - rf) * 0.75;
      });

      if (S.playing && !S.still && S.sel < 0 && S.station < 0 && !S.commute && performance.now() - S.idleAt > 3000) controls.rotate(Math.sin(t * 0.25) * 0.00025, 0, false);
      controls.update(dt);
      if (frameNo % 6 === 1) { const before = pxPerUnit; measurePx(); if (Math.abs(before - pxPerUnit) > 0.15) renderLegend(); }
      const taken = [];
      updateBadge();
      if (!badge.hidden) { const r = badge.getBoundingClientRect(); taken.push([r.left, r.top, r.right, r.bottom]); }
      for (const el of labelEls) {
        if (!el.arc || !layerState.flow || el.arc.reveal < 1) { el.hidden = true; continue; }
        bez(el.arc, 0.5, P); P.y += 0.6; P.project(camera);
        const x = (P.x * 0.5 + 0.5) * innerWidth, y0 = (-P.y * 0.5 + 0.5) * innerHeight, w = el._w || 90, hgt = el._h || 34;
        let y = null;
        for (const cand of [y0, y0 - hgt - 4, y0 + hgt + 4]) {
          const r = [x - w / 2, cand - hgt, x + w / 2, cand];
          if (!taken.some((q) => r[0] < q[2] && r[2] > q[0] && r[1] < q[3] && r[3] > q[1])) { y = cand; taken.push(r); break; }
        }
        el.hidden = y === null || P.z > 1; if (el.hidden) continue;
        el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) translate(-50%, -100%)`;
      }
      updateLabels(taken, SAh);
      if (composer) composer.render(); else renderer.render(scene, camera);
    }
    frame();

    return {
      dispose() {
        cancelAnimationFrame(raf); controls.dispose(); timer.dispose(); clearTimeout(toastTimer);
        scene.traverse((o) => { o.geometry?.dispose(); const m = o.material; (Array.isArray(m) ? m : m ? [m] : []).forEach((x) => { x.map?.dispose(); x.dispose(); }); });
        composer?.dispose(); renderer.dispose();
      },
    };
  }

  return {
    dispose() {
      disposed = true; ac.abort(); tweens.forEach((x) => x.kill());
      api?.dispose(); root.remove();
    },
  };
}

// ───────────────────────── Picker（PICKER.md 的 reference wiring） ─────────────────────────
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0, app = null;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  app?.dispose(); app = null;
  stage.innerHTML = '';
  // Clear first, render next frame, so entrance animations re-run.
  requestAnimationFrame(() => { app = startApp(stage, i); });
}

function setActive(i) {
  if (i < 0 || i >= VARIANTS.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= VARIANTS.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % VARIANTS.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + VARIANTS.length) % VARIANTS.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
// Enable the slide only after first paint, so load doesn't animate.
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
</body>
